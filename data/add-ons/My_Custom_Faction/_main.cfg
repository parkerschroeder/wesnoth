#textdomain wesnoth-My_Custom_Faction
[textdomain]
    name="wesnoth-My_Custom_Faction"
    path="data/add-ons/My_Custom_Faction/translations"
[/textdomain]

[binary_path]
    path=data/add-ons/My_Custom_Faction
[/binary_path]

[era]
    id=era_my_custom
    name= _ "My Custom Era"
    description= _ "A custom era featuring the My Custom Faction."
    require_era=no

    [multiplayer_side]
        id=My_Custom_Faction
        name= _ "My Custom Faction"
        image="units/elves-wood/captain.png"
        type=random
        leader=Elvish Captain,Elvish Hero,Elvish Ranger,Elvish Marksman,Elvish Druid,Elvish Sorceress,White Mage,Red Mage,Elder Wose
        random_leader=Elvish Captain,Elvish Hero,Elvish Ranger,Elvish Marksman,Elvish Druid,Elvish Sorceress,White Mage,Red Mage
        recruit=Elvish Fighter,Elvish Archer,Mage,Elvish Shaman,Elvish Scout,Wose,Merman Hunter
        terrain_liked=Ff, Fa, Ss, Ww
        description= _ "A custom faction based on the Rebels. Customize this description, units, and leaders to make it your own!"
        [ai]
            recruitment_pattern=fighter,fighter,archer,archer,mixed fighter,healer,scout
        [/ai]
    [/multiplayer_side]
[/era]
