#textdomain wesnoth-My_Custom_Era

# Custom mushroom terrain overlays for the Mycelium faction

# Mushroom Forest: replaces tree overlays when fungal spread absorbs a forest
# Stats blend base terrain + fungus + forest
[terrain_type]
    symbol_image=forest/mushrooms-tile
    id=mushroom_forest
    name= _ "Mushroom Forest"
    editor_name= _ "Mushroom Forest"
    string=^Tff
    aliasof=_bas,Tt,Ft
    mvt_alias=-,_bas,Tt,Ft
    default_base=Gg
    editor_group=forest, cave
[/terrain_type]
