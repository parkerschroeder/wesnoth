#textdomain wesnoth-My_Custom_Era

# Terrains where mushrooms CANNOT grow
# water, desert, dry hills, frozen, mountains, castles/keeps, lava/chasms, impassable
#define FUNGAL_SPREAD_EXCLUDED_TERRAINS
Ww*,Wo*,Dd*,Ds*,Hd,Aa,Ai,Mm*,Md*,Ms*,Mv,C*,K*,Ql*,Qx*,Xu*,Xo*,Xv#enddef

# Shared macro: convert a hex to Mushroom Grove overlay
# Step 1: store the hex terrain string
# Step 2: if terrain string contains "^" → hex already has an overlay
#         → if it's a forest overlay, convert to Mushroom Forest (^Tfp)
#         → otherwise skip (villages, bridges, etc.)
# Step 3: if no overlay and terrain is in the exclusion list → skip
# Step 4: apply ^Tf overlay
#define FUNGAL_SPREAD X Y
    [store_locations]
        x,y={X},{Y}
        variable=fs_hex
    [/store_locations]
    [if]
        [variable]
            name=fs_hex.terrain
            contains=^
        [/variable]
        [then]
            # hex has an overlay — check if it's a forest (overlay starts with F)
            [if]
                [variable]
                    name=fs_hex.terrain
                    contains=^F
                [/variable]
                [then]
                    [terrain]
                        x,y={X},{Y}
                        terrain=^Tff
                        layer=overlay
                    [/terrain]
                [/then]
            [/if]
        [/then]
        [else]
            [if]
                [have_location]
                    x,y={X},{Y}
                    [not]
                        terrain={FUNGAL_SPREAD_EXCLUDED_TERRAINS}
                    [/not]
                [/have_location]
                [then]
                    [terrain]
                        x,y={X},{Y}
                        terrain=^Tf
                        layer=overlay
                    [/terrain]
                [/then]
            [/if]
        [/else]
    [/if]
    {CLEAR_VARIABLE fs_hex}
#enddef

# Passive Fungal Spread: every mushroom-race unit converts its hex at turn start
#define MYCELIUM_PASSIVE_SPREAD_EVENT
[event]
    name=side turn
    id=mycelium_passive_spread
    first_time_only=no
    [store_unit]
        [filter]
            side=$side_number
            race=mushroom
        [/filter]
        variable=mushroom_units
        kill=no
    [/store_unit]
    [foreach]
        array=mushroom_units
        [do]
            {FUNGAL_SPREAD $this_item.x $this_item.y}
        [/do]
    [/foreach]
    {CLEAR_VARIABLE mushroom_units}
[/event]
#enddef

# Kill Spread: when a Mycelium unit kills an enemy, convert the death hex
#define MYCELIUM_KILL_SPREAD_EVENT
[event]
    name=die
    id=mycelium_kill_spread
    first_time_only=no
    [filter_second]
        race=mushroom
    [/filter_second]
    {FUNGAL_SPREAD $x1 $y1}
[/event]
#enddef

# Grove Reanimation: when any enemy dies on Mushroom Grove to a Mycelium unit, spawn Fungal Zombie
# Respects plague immunity — unplagueable units (undead, mechanical) cannot be reanimated
#define MYCELIUM_GROVE_REANIMATION_EVENT
[event]
    name=die
    id=mycelium_grove_reanimation
    first_time_only=no
    [filter]
        [not]
            status=unplagueable
        [/not]
    [/filter]
    [filter_second]
        race=mushroom
    [/filter_second]
    [filter_condition]
        [have_location]
            x,y=$x1,$y1
            terrain=*^Tf,*^Tff
        [/have_location]
    [/filter_condition]
    [unit]
        type=Mycelium_Fungal_Zombie
        x,y=$x1,$y1
        side=$second_unit.side
        animate=yes
    [/unit]
    [message]
        speaker=narrator
        image=wesnoth-icon.png
        message= _ "The grove consumes the fallen, and a Fungal Zombie rises!"
    [/message]
[/event]
#enddef
