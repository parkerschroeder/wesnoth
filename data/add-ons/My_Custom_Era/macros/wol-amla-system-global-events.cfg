#textdomain wesnoth-My_Custom_Era

# load the lua

[event]
    name="preload"
    first_time_only=no

    [lua]
        code= << wesnoth.require "~add-ons/My_Custom_Era/lua/base.lua" >>
    [/lua]
    [lua]
        code= << wesnoth.require "~add-ons/My_Custom_Era/lua/gui/amla_list.lua" >>
    [/lua]
[/event]

# add AMLA menu

[event]
    name="prestart"

    {AMLA_MENU}
[/event]

# add AMLA
{AMLA_WOL_OVERRIDE}
