#textdomain wesnoth-My_Custom_Era

[era]
    id=My_Custom_Era
    name= _ "My Custom Era"

    description= _ "A custom era based on War of Legends with additional factions."

    require_era=yes
    min_addon_version="1.2.7.80"

    {RANDOM_SIDE}

    {WOL_SIDE WOL Humans}
    {WOL_SIDE WOL Orcs}
    {WOL_SIDE WOL Vampires}
    {WOL_SIDE WOL Aragwaithi}
    {WOL_SIDE WOL Sylvans}
    {WOL_SIDE WOL Legion}
    {WOL_SIDE WOL Undead}
    {WOL_SIDE WOL Outlaws}
    {WOL_SIDE WOL Windsong}
    {WOL_SIDE WOL Quenoth}
    {WOL_SIDE WOL Minotaurs}
    {WOL_SIDE WOL Deep-Elves}
    {WOL_SIDE WOL Steelhive}
    {WOL_SIDE WOL Nightmares}
    {WOL_SIDE WOL Drakes}
    # {multiplayer/factions/drakes-default.cfg}
    {multiplayer/factions/knalgans-default.cfg}
    {multiplayer/factions/dunefolk-default.cfg}
    [multiplayer_side]
        id=My_Custom_Faction
        name= _ "My Custom Faction"
        image="units/elves-wood/captain.png"
        type=random
        leader=Elvish Captain,Elvish Hero,Elvish Ranger,Elvish Marksman,Elvish Druid,Elvish Sorceress,White Mage,Red Mage,Elder Wose
        random_leader=Elvish Captain,Elvish Hero,Elvish Ranger,Elvish Marksman,Elvish Druid,Elvish Sorceress,White Mage,Red Mage
        recruit=Elvish Fighter,Elvish Archer,Mage,Mycelium_Lions_Mane,Elvish Scout,Wose,Merman Hunter
        terrain_liked=Ff, Fa, Ss, Ww
        description= _ "A custom faction based on the Rebels."
        [ai]
            recruitment_pattern=fighter,fighter,archer,archer,mixed fighter,healer,scout
        [/ai]
    [/multiplayer_side]

    {QUICK_4MP_LEADERS}
    {TURNS_OVER_ADVANTAGE}

    [load_resource]
        id=WOL_resource_mp_era
    [/load_resource]
    [load_resource]
        id=WOL_resource_smart_AI
    [/load_resource]
    [load_resource]
        id=wol_deep_elves_minotaur_upkeep
    [/load_resource]
[/era]
