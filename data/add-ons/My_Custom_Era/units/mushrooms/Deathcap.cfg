#textdomain wesnoth-My_Custom_Era

[unit_type]
    id=Mycelium_Deathcap
    name= _ "Deathcap"
    race=mushroom
    image="units/monsters/spider.png"
    hitpoints=24
    movement_type=fungalfoot
    movement=5
    experience=36
    level=1
    alignment=chaotic
    advances_to=null
    cost=16
    usage=fighter
    description= _ "A deadly Amanita whose every touch carries lethal toxins. Fragile but devastatingly poisonous, the Deathcap weakens enemies over time while staying just out of reach."
    die_sound=hiss-die.ogg

    [attack]
        name=toxic_touch
        description= _ "toxic touch"
        icon=attacks/touch-undead.png
        type=blade
        range=melee
        damage=4
        number=2
        [specials]
            {WEAPON_SPECIAL_POISON}
        [/specials]
    [/attack]
    [attack]
        name=poison_dart
        description= _ "poison dart"
        icon=attacks/sling.png
        type=pierce
        range=ranged
        damage=5
        number=2
        [specials]
            {WEAPON_SPECIAL_POISON}
        [/specials]
    [/attack]
[/unit_type]
