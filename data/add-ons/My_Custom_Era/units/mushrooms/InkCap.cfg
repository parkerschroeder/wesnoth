    [attack]
        name=ink_bolt
        description= _ "ink bolt"
        icon=attacks/iceball.png
        type=cold
        range=ranged
        damage=7
        number=2
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
    [/attack]
