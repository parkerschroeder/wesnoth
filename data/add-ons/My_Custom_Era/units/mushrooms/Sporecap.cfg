#textdomain wesnoth-My_Custom_Era

[unit_type]
    id=Mycelium_Sporecap
    name= _ "Sporecap"
    race=mushroom
    image="units/monsters/giant-mudcrawler.png"
    hitpoints=38
    movement_type=fungalfoot
    movement=4
    experience=40
    level=1
    alignment=chaotic
    advances_to=null
    cost=15
    usage=fighter
    description= _ "A stout toadstool warrior that anchors the Mycelium battle line. Its thick cap absorbs punishment while its spore puffs slow advancing enemies to a crawl."
