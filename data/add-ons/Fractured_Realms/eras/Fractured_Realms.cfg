#textdomain wesnoth-Fractured_Realms

[era]
    id=Fractured_Realms
    name= _ "Fractured Realms Era"
    description= _ "All War of Legends factions plus the custom Mycelium fungal faction. Requires War of Legends add-on."
    require_era=yes

    {RANDOM_SIDE}

    {~add-ons/War_of_Legends/factions/WOL/Humans-WOL.cfg}
    {~add-ons/War_of_Legends/factions/WOL/Orcs-WOL.cfg}
    {~add-ons/War_of_Legends/factions/WOL/Vampires-WOL.cfg}
    {~add-ons/War_of_Legends/factions/WOL/Aragwaithi-WOL.cfg}
    {~add-ons/War_of_Legends/factions/WOL/Sylvans-WOL.cfg}
    {~add-ons/War_of_Legends/factions/WOL/Legion-WOL.cfg}
    {~add-ons/War_of_Legends/factions/WOL/Undead-WOL.cfg}
    {~add-ons/War_of_Legends/factions/WOL/Outlaws-WOL.cfg}
    {~add-ons/War_of_Legends/factions/WOL/Windsong-WOL.cfg}
    {~add-ons/War_of_Legends/factions/WOL/Quenoth-WOL.cfg}
    {~add-ons/War_of_Legends/factions/WOL/Minotaurs-WOL.cfg}
    {~add-ons/War_of_Legends/factions/WOL/Deep-Elves-WOL.cfg}
    {~add-ons/War_of_Legends/factions/WOL/Steelhive-WOL.cfg}
    {~add-ons/War_of_Legends/factions/WOL/Nightmares-WOL.cfg}
    {~add-ons/War_of_Legends/factions/WOL/Drakes-WOL.cfg}
    {~add-ons/Fractured_Realms/factions/Mycelium.cfg}
    {multiplayer/factions/knalgans-default.cfg}
    {multiplayer/factions/dunefolk-default.cfg}

    {QUICK_4MP_LEADERS}
    {TURNS_OVER_ADVANTAGE}

    [load_resource]
        id=WOL_resource_mp_era
    [/load_resource]
    [load_resource]
        id=WOL_resource_smart_AI
    [/load_resource]
    [load_resource]
        id=wol_deep_elves_minotaur_upkeep
    [/load_resource]
    [load_resource]
        id=Mycelium_resource_fungal_spread
    [/load_resource]
    [load_resource]
        id=Werefolk_resource_lycanthropy
    [/load_resource]
[/era]
