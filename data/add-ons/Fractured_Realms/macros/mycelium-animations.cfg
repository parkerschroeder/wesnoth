#textdomain wesnoth-Fractured_Realms

# Animation macros for single-sprite mushroom units.
# These create defend, death, attack, and idle animations
# without requiring any additional images beyond the base sprite.

# ─── DEFEND ────────────────────────────────────────────────

#define MUSHROOM_DEFEND BASE_IMAGE HIT_SOUND
    # Defend animation: recoils backward and flashes red on hit.
    # On miss, recoils further with no flash.
    [defend]
        start_time=-126
        [if]
            hits=hit
            offset=0.0~-0.08:126,-0.08~0.0:126
            hit_sound_start_time=-25
            [hit_sound_frame]
                sound={HIT_SOUND}
            [/hit_sound_frame]
        [/if]
        [else]
            hits=miss
            offset=0.0~-0.12:126,-0.12~0.0:126
        [/else]
        [frame]
            image={BASE_IMAGE}:252
        [/frame]
    [/defend]
#enddef

#define MUSHROOM_DEFEND_BLINK BASE_IMAGE HIT_SOUND
    # Defend animation: fades semi-transparent and recoils on hit.
    # Good for ethereal/glowing mushrooms (Glowcap, Milky Way, etc.)
    [defend]
        start_time=-126
        [if]
            hits=hit
            offset=0.0~-0.06:126,-0.06~0.0:126
            alpha=1.0~0.4:126,0.4~1.0:126
            hit_sound_start_time=-25
            [hit_sound_frame]
                sound={HIT_SOUND}
            [/hit_sound_frame]
        [/if]
        [else]
            hits=miss
            offset=0.0~-0.1:126,-0.1~0.0:126
            alpha=1.0~0.3:126,0.3~1.0:126
        [/else]
        [frame]
            image={BASE_IMAGE}:252
        [/frame]
    [/defend]
#enddef

# ─── DEATH ─────────────────────────────────────────────────

#define MUSHROOM_DEATH BASE_IMAGE DIE_SOUND
    # Death animation: fades out over ~600ms.
    [death]
        start_time=0
        [frame]
            image={BASE_IMAGE}:600
            alpha=1.0~0.0:600
            sound={DIE_SOUND}
        [/frame]
        [frame]
            image="misc/blank-hex.png:1"
        [/frame]
    [/death]
#enddef

#define MUSHROOM_DEATH_SINK BASE_IMAGE DIE_SOUND
    # Death animation: sinks into the ground and fades.
    # Good for heavier/rooted mushrooms (Oysters, Morels, etc.)
    [death]
        start_time=0
        [frame]
            image={BASE_IMAGE}:700
            alpha=1.0~0.0:700
            submerge=0.0~1.0:700
            sound={DIE_SOUND}
        [/frame]
        [frame]
            image="misc/blank-hex.png:1"
        [/frame]
    [/death]
#enddef

# ─── MELEE ATTACK ──────────────────────────────────────────

#define MUSHROOM_ATTACK_MELEE BASE_IMAGE ATTACK_NAME HIT_SOUND
    # Melee attack: lunges forward then returns.
    [attack_anim]
        [filter_attack]
            name={ATTACK_NAME}
            range=melee
        [/filter_attack]
        start_time=-250
        offset=0.0~0.5:250,0.5~0.0:200
        [frame]
            image={BASE_IMAGE}:250
        [/frame]
        [frame]
            image={BASE_IMAGE}:200
            sound={HIT_SOUND}
        [/frame]
    [/attack_anim]
#enddef

#define MUSHROOM_ATTACK_MELEE_BERSERK BASE_IMAGE ATTACK_NAME HIT_SOUND
    # Berserk melee attack: aggressive lunge with red flash.
    [attack_anim]
        [filter_attack]
            name={ATTACK_NAME}
            range=melee
        [/filter_attack]
        start_time=-200
        offset=0.0~0.6:200,0.6~0.0:150
        [frame]
            image={BASE_IMAGE}:200
        [/frame]
        [frame]
            image={BASE_IMAGE}:150
            sound={HIT_SOUND}
        [/frame]
    [/attack_anim]
#enddef

# ─── RANGED ATTACK ─────────────────────────────────────────

#define MUSHROOM_ATTACK_RANGED BASE_IMAGE ATTACK_NAME MISSILE_IMAGE HIT_SOUND
    # Ranged attack with a projectile. Unit rocks back slightly on release.
    [attack_anim]
        [filter_attack]
            name={ATTACK_NAME}
            range=ranged
        [/filter_attack]
        start_time=-300
        offset=0.0~-0.1:150,-0.1~0.0:300
        missile_start_time=-150
        [missile_frame]
            duration=150
            image={MISSILE_IMAGE}
            image_diagonal={MISSILE_IMAGE}
        [/missile_frame]
        [frame]
            image={BASE_IMAGE}:150
        [/frame]
        [frame]
            image={BASE_IMAGE}:300
            sound={HIT_SOUND}
        [/frame]
    [/attack_anim]
#enddef

#define MUSHROOM_ATTACK_RANGED_MAGIC BASE_IMAGE ATTACK_NAME HIT_SOUND
    # Magical ranged attack: no projectile, unit flashes bright on cast.
    # Good for spark bolt, lightning, spore burst.
    [attack_anim]
        [filter_attack]
            name={ATTACK_NAME}
            range=ranged
        [/filter_attack]
        start_time=-300
        offset=0.0~-0.05:150,-0.05~0.0:300
        [frame]
            image={BASE_IMAGE}:150
        [/frame]
        [frame]
            image={BASE_IMAGE}:300
            sound={HIT_SOUND}
        [/frame]
    [/attack_anim]
#enddef

# ─── IDLE / STANDING ───────────────────────────────────────

#define MUSHROOM_IDLE_GLOW BASE_IMAGE
    # Subtle alpha pulse — good for bioluminescent units (Glowcap line).
    [idle_anim]
        start_time=0
        [frame]
            image={BASE_IMAGE}:3000
            alpha=1.0~0.7:1500,0.7~1.0:1500
        [/frame]
    [/idle_anim]
#enddef

#define MUSHROOM_IDLE_SWAY BASE_IMAGE
    # Subtle side-to-side sway using directional offset.
    [idle_anim]
        start_time=0
        offset=0.0~0.02:800,0.02~-0.02:1600,-0.02~0.0:800
        [frame]
            image={BASE_IMAGE}:3200
        [/frame]
    [/idle_anim]
#enddef
