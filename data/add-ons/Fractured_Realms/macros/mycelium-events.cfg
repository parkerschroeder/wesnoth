#textdomain wesnoth-Fractured_Realms

# Fungal Plague: uses the built-in WEAPON_SPECIAL_PLAGUE_TYPE macro
# to spawn Fungal Spores instead of Walking Corpses.
# Usage: {WEAPON_SPECIAL_FUNGAL_PLAGUE} in a [specials] block.
#define WEAPON_SPECIAL_FUNGAL_PLAGUE
    {WEAPON_SPECIAL_PLAGUE_TYPE "Mycelium_Fungal_Spore"}
#enddef

# Terrains where mushrooms CANNOT grow
# water, desert, dry hills, frozen, mountains, castles/keeps, lava/chasms, impassable
#define FUNGAL_SPREAD_EXCLUDED_TERRAINS
Ww*,Wo*,Dd*,Ds*,Hd,Aa,Ai,Mm*,Md*,Ms*,Mv,C*,K*,Ql*,Qx*,Xu*,Xo*,Xv#enddef

# Shared macro: convert a hex to Mushroom Grove overlay
# Step 1: store the hex terrain string
# Step 2: if terrain string contains "^" → hex already has an overlay
#         → if it's a forest overlay, convert to Mushroom Forest (^Tfp)
#         → otherwise skip (villages, bridges, etc.)
# Step 3: if no overlay and terrain is in the exclusion list → skip
# Step 4: apply ^Tf overlay
#define FUNGAL_SPREAD X Y
    [store_locations]
        x,y={X},{Y}
        variable=fs_hex
    [/store_locations]
    [if]
        [variable]
            name=fs_hex.terrain
            contains=^
        [/variable]
        [then]
            # hex has an overlay — check if it's a forest (overlay starts with F)
            [if]
                [variable]
                    name=fs_hex.terrain
                    contains=^F
                [/variable]
                [then]
                    [terrain]
                        x,y={X},{Y}
                        terrain=^Tff
                        layer=overlay
                    [/terrain]
                [/then]
            [/if]
        [/then]
        [else]
            [if]
                [have_location]
                    x,y={X},{Y}
                    [not]
                        terrain={FUNGAL_SPREAD_EXCLUDED_TERRAINS}
                    [/not]
                [/have_location]
                [then]
                    [terrain]
                        x,y={X},{Y}
                        terrain=^Tf
                        layer=overlay
                    [/terrain]
                [/then]
            [/if]
        [/else]
    [/if]
    {CLEAR_VARIABLE fs_hex}
#enddef

# Passive Fungal Spread: every unit with the mycelium trait converts its hex at turn start
#define MYCELIUM_PASSIVE_SPREAD_EVENT
[event]
    name=side turn
    id=mycelium_passive_spread
    first_time_only=no
    [store_unit]
        [filter]
            side=$side_number
            [filter_wml]
                [modifications]
                    [trait]
                        id=fungal_growth
                    [/trait]
                [/modifications]
            [/filter_wml]
        [/filter]
        variable=mushroom_units
        kill=no
    [/store_unit]
    [foreach]
        array=mushroom_units
        [do]
            {FUNGAL_SPREAD $this_item.x $this_item.y}
        [/do]
    [/foreach]
    {CLEAR_VARIABLE mushroom_units}
[/event]
#enddef

# Kill Spread removed — terrain spreads passively each turn under all mushroom
# units, which is simpler and avoids timing conflicts with the plague system.
# Macro kept as no-op for backward compatibility with wol-resource-tags.cfg.
#define MYCELIUM_KILL_SPREAD_EVENT
#enddef

# Grove Reanimation now handled by WEAPON_SPECIAL_FUNGAL_PLAGUE (built-in plague system)
#define MYCELIUM_GROVE_REANIMATION_EVENT
#enddef

# Death Bloom: when a unit with death_bloom dies, all adjacent hexes become groves.
# Global event registered via resource tag (same pattern as passive spread).
# The [dummy] ability on FungalZombie.cfg provides the tooltip display.
#define MYCELIUM_DEATH_BLOOM_EVENT
[event]
    name=die
    id=mycelium_death_bloom
    first_time_only=no
    [filter]
        [filter_wml]
            [abilities]
                [dummy]
                    id=death_bloom
                [/dummy]
            [/abilities]
        [/filter_wml]
    [/filter]
    [store_locations]
        x,y=$x1,$y1
        radius=1
        variable=bloom_hexes
    [/store_locations]
    [foreach]
        array=bloom_hexes
        [do]
            {FUNGAL_SPREAD $this_item.x $this_item.y}
            # Poison any enemy unit on this hex
            [modify_unit]
                [filter]
                    x,y=$this_item.x,$this_item.y
                    [not]
                        side=$unit.side
                    [/not]
                [/filter]
                [status]
                    poisoned=yes
                [/status]
            [/modify_unit]
        [/do]
    [/foreach]
    {CLEAR_VARIABLE bloom_hexes}
[/event]
#enddef

# Spore Cloud: when a unit with spore_cloud hits with ranged, all adjacent enemies around the target are slowed.
# Fires on attacker_hits. Global event registered via resource tag.
#define MYCELIUM_SPORE_CLOUD_EVENT
[event]
    name=attacker_hits
    id=mycelium_spore_cloud
    first_time_only=no
    [filter]
        [filter_wml]
            [abilities]
                [dummy]
                    id=spore_cloud
                [/dummy]
            [/abilities]
        [/filter_wml]
        [filter_attack]
            range=ranged
        [/filter_attack]
    [/filter]
    [store_unit]
        [filter]
            [filter_adjacent]
                x,y=$x2,$y2
                is_enemy=yes
            [/filter_adjacent]
            [not]
                x,y=$x2,$y2
            [/not]
        [/filter]
        variable=spore_cloud_targets
    [/store_unit]
    [foreach]
        array=spore_cloud_targets
        [do]
            [modify_unit]
                [filter]
                    id=$spore_cloud_targets[$i].id
                [/filter]
                [status]
                    slowed=yes
                [/status]
            [/modify_unit]
        [/do]
    [/foreach]
    # The target itself is slowed by the weapon special, so no extra action needed
    {CLEAR_VARIABLE spore_cloud_targets}
[/event]
#enddef

# Toxic Spores: when a unit with toxic_spores is attacked, the attacker is poisoned.
# Fires at end of combat. Global event registered via resource tag.
#define MYCELIUM_TOXIC_SPORES_EVENT
[event]
    name=attack_end
    id=mycelium_toxic_spores
    first_time_only=no
    [filter_second]
        [filter_wml]
            [abilities]
                [dummy]
                    id=toxic_spores
                [/dummy]
            [/abilities]
        [/filter_wml]
    [/filter_second]
    [modify_unit]
        [filter]
            id=$unit.id
        [/filter]
        [status]
            poisoned=yes
        [/status]
    [/modify_unit]
[/event]
#enddef
