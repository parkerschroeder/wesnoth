#textdomain wesnoth-Fractured_Realms

# Apply poison to a unit, respecting unpoisonable immunity.
# Usage: {APPLY_POISON FILTER} where FILTER is a SUF (Standard Unit Filter).
# Example: {APPLY_POISON id=$unit.id}
#define APPLY_POISON FILTER
    [modify_unit]
        [filter]
            {FILTER}
            [not]
                [filter_wml]
                    [status]
                        unpoisonable=yes
                    [/status]
                [/filter_wml]
            [/not]
        [/filter]
        [status]
            poisoned=yes
        [/status]
    [/modify_unit]
#enddef

# Fungal Plague: uses the built-in WEAPON_SPECIAL_PLAGUE_TYPE macro
# to spawn Fungal Spores instead of Walking Corpses.
# Usage: {WEAPON_SPECIAL_FUNGAL_PLAGUE} in a [specials] block.
#define WEAPON_SPECIAL_FUNGAL_PLAGUE
    {WEAPON_SPECIAL_PLAGUE_TYPE "Mycelium_Fungal_Spore"}
#enddef

# Grove Bound: disables an attack unless the unit is on a mushroom grove.
# Usage: {WEAPON_SPECIAL_GROVE_BOUND} in a [specials] block.
#define WEAPON_SPECIAL_GROVE_BOUND
    [disable]
        id=grove_bound
        name= _ "grove bound"
        description= _ "This attack can only be used on offense while standing on a mushroom grove. Using it consumes the grove, reverting it to normal terrain."
        active_on=offense
        [filter_self]
            [filter_location]
                [not]
                    terrain="*^Tf,*^Tff"
                [/not]
            [/filter_location]
        [/filter_self]
    [/disable]
    [disable]
        id=grove_bound_defense
        active_on=defense
    [/disable]
#enddef

# Terrains where mushrooms CANNOT grow
# water, desert, dry hills, frozen, mountains, castles/keeps, lava/chasms, impassable
#define FUNGAL_SPREAD_EXCLUDED_TERRAINS
Ww*,Wo*,Dd*,Ds*,Hd,Aa*,Ai*,Ha*,Mm*,Md*,Ms*,Mv,C*,K*,Ql*,Qx*,Xu*,Xo*,Xv#enddef

# Shared macro: convert a hex to Mushroom Grove overlay
# Step 1: store the hex terrain string
# Step 2: if terrain string contains "^" → hex already has an overlay
#         → if it's a forest overlay, convert to Mushroom Forest (^Tfp)
#         → otherwise skip (villages, bridges, etc.)
# Step 3: if no overlay and terrain is in the exclusion list → skip
# Step 4: apply ^Tf overlay
#define FUNGAL_SPREAD X Y
    [store_locations]
        x,y={X},{Y}
        variable=fs_hex
    [/store_locations]
    [if]
        [variable]
            name=fs_hex.terrain
            contains=^
        [/variable]
        [then]
            # hex has an overlay — check if it's a forest (overlay starts with F)
            [if]
                [variable]
                    name=fs_hex.terrain
                    contains=^F
                [/variable]
                [then]
                    [terrain]
                        x,y={X},{Y}
                        terrain=^Tff
                        layer=overlay
                    [/terrain]
                [/then]
            [/if]
        [/then]
        [else]
            [if]
                [have_location]
                    x,y={X},{Y}
                    [not]
                        terrain={FUNGAL_SPREAD_EXCLUDED_TERRAINS}
                    [/not]
                [/have_location]
                [then]
                    [terrain]
                        x,y={X},{Y}
                        terrain=^Tf
                        layer=overlay
                    [/terrain]
                [/then]
            [/if]
        [/else]
    [/if]
    {CLEAR_VARIABLE fs_hex}
#enddef

# Passive Fungal Spread: every unit with the mycelium trait converts its hex at turn start
#define MYCELIUM_PASSIVE_SPREAD_EVENT
[event]
    name=side turn
    id=mycelium_passive_spread
    first_time_only=no
    [store_unit]
        [filter]
            side=$side_number
            [filter_wml]
                [modifications]
                    [trait]
                        id=fungal_growth
                    [/trait]
                [/modifications]
            [/filter_wml]
        [/filter]
        variable=mushroom_units
        kill=no
    [/store_unit]
    [foreach]
        array=mushroom_units
        [do]
            # Heal 2 HP if standing on mushroom grove (fungus terrain)
            [if]
                [have_location]
                    x,y=$this_item.x,$this_item.y
                    terrain=*^Tf,*^Tff,Tt*
                [/have_location]
                [then]
                    [heal_unit]
                        [filter]
                            x,y=$this_item.x,$this_item.y
                            id=$this_item.id
                        [/filter]
                        amount=2
                        animate=yes
                        restore_statuses=no
                    [/heal_unit]
                [/then]
            [/if]
            {FUNGAL_SPREAD $this_item.x $this_item.y}
        [/do]
    [/foreach]
    {CLEAR_VARIABLE mushroom_units}
[/event]
#enddef

# Overgrowth: units with the overgrowth ability spread groves to all
# adjacent hexes each turn, not just their own hex. Stacks with passive spread.
#define MYCELIUM_OVERGROWTH_EVENT
[event]
    name=side turn
    id=mycelium_overgrowth
    first_time_only=no
    [store_unit]
        [filter]
            side=$side_number
            [filter_wml]
                [abilities]
                    [dummy]
                        id=overgrowth
                    [/dummy]
                [/abilities]
            [/filter_wml]
        [/filter]
        variable=network_units
        kill=no
    [/store_unit]
    [foreach]
        array=network_units
        [do]
            [store_locations]
                x,y=$this_item.x,$this_item.y
                radius=1
                variable=network_hexes
            [/store_locations]
            [foreach]
                array=network_hexes
                [do]
                    {FUNGAL_SPREAD $this_item.x $this_item.y}
                [/do]
            [/foreach]
            {CLEAR_VARIABLE network_hexes}
        [/do]
    [/foreach]
    {CLEAR_VARIABLE network_units}
[/event]
#enddef

# Kill Spread removed — terrain spreads passively each turn under all mushroom
# units, which is simpler and avoids timing conflicts with the plague system.
# Macro kept as no-op for backward compatibility with wol-resource-tags.cfg.
#define MYCELIUM_KILL_SPREAD_EVENT
#enddef

# Grove Reanimation now handled by WEAPON_SPECIAL_FUNGAL_PLAGUE (built-in plague system)
#define MYCELIUM_GROVE_REANIMATION_EVENT
#enddef

# Death Bloom: when a unit with death_bloom dies, all adjacent hexes become groves.
# Global event registered via resource tag (same pattern as passive spread).
# The [dummy] ability on FungalZombie.cfg provides the tooltip display.
#define MYCELIUM_DEATH_BLOOM_EVENT
[event]
    name=die
    id=mycelium_death_bloom
    first_time_only=no
    [filter]
        [filter_wml]
            [abilities]
                [dummy]
                    id=death_bloom
                [/dummy]
            [/abilities]
        [/filter_wml]
    [/filter]
    [store_locations]
        x,y=$x1,$y1
        radius=1
        variable=bloom_hexes
    [/store_locations]
    [foreach]
        array=bloom_hexes
        [do]
            {FUNGAL_SPREAD $this_item.x $this_item.y}
            # Poison any enemy unit on this hex (skip unpoisonable + allies)
            {APPLY_POISON (
                x,y=$this_item.x,$this_item.y
                [filter_side]
                    [enemy_of]
                        side=$unit.side
                    [/enemy_of]
                [/filter_side]
            )}
        [/do]
    [/foreach]
    {CLEAR_VARIABLE bloom_hexes}
[/event]
#enddef

# Grove Consumption: when a unit uses an attack with the grove_bound special,
# the mushroom grove under the attacker is consumed (overlay removed).
# Mushroom forest (^Tff) reverts to regular forest (^Fp).
# Mushroom grove (^Tf) is stripped entirely.
# Fires on attack event (before combat resolves).
#define MYCELIUM_GROVE_CONSUMPTION_EVENT
[event]
    name=attack
    id=mycelium_grove_consumption
    first_time_only=no
    [filter]
        [filter_location]
            terrain="*^Tf,*^Tff"
        [/filter_location]
        [filter_attack]
            special_id=grove_bound
        [/filter_attack]
    [/filter]
    # Check if it's mushroom forest — revert to regular forest
    [if]
        [have_location]
            x,y=$x1,$y1
            terrain="*^Tff"
        [/have_location]
        [then]
            [terrain]
                x,y=$x1,$y1
                terrain=^Fp
                layer=overlay
            [/terrain]
        [/then]
        [else]
            # Regular mushroom grove — strip overlay entirely
            [terrain]
                x,y=$x1,$y1
                terrain=^
                layer=overlay
            [/terrain]
        [/else]
    [/if]
[/event]
#enddef

# AoE: on hit, deals splash damage to all enemies adjacent to the target,
# and optionally applies a status effect.
# Usage: {WEAPON_SPECIAL_AOE ID NAME DESC} in a [specials] block.
# ID is a unique identifier for this AoE type.
# Example: {WEAPON_SPECIAL_AOE spore_cloud "spore cloud" "When this attack hits, all enemies adjacent to the target take 50% splash damage and are slowed."}
# Example: {WEAPON_SPECIAL_AOE burst "spore burst" "When this attack hits, all enemies adjacent to the target take 50% splash damage."}
#define WEAPON_SPECIAL_AOE ID NAME DESC
    [dummy]
        id=aoe_{ID}
        name= _ "{NAME}"
        description= _ "{DESC}"
    [/dummy]
#enddef

# AoE event: fires on attacker_hits for any attack with the aoe_ID special.
# ID must match the ID used in WEAPON_SPECIAL_AOE.
# DAMAGE_PCT is the fraction of damage_inflicted dealt as splash (e.g. 0.5 = 50%).
# STATUS is the status effect to apply (e.g. slowed, poisoned). Use "none" for damage only.
# IMMUNITY is the status that makes a unit immune (e.g. unpoisonable). Use "none" to skip.
# Splash damage type is automatically inherited from the attack.
# Must register one event per unique ID used.
# Example: {AOE_EVENT spore_cloud 0.5 slowed none}       — 50% splash + slow, no immunity check
# Example: {AOE_EVENT poison_cloud 0.5 poisoned unpoisonable} — 50% splash + poison, skips immune units
#define AOE_EVENT ID DAMAGE_PCT STATUS IMMUNITY
[event]
    name=attacker_hits
    id=aoe_{ID}
    first_time_only=no
    [filter_attack]
        special_id=aoe_{ID}
    [/filter_attack]
    [store_unit]
        [filter]
            [filter_adjacent]
                x,y=$x2,$y2
            [/filter_adjacent]
            [not]
                x,y=$x2,$y2
            [/not]
            [filter_side]
                [enemy_of]
                    side=$unit.side
                [/enemy_of]
            [/filter_side]
        [/filter]
        variable=aoe_targets
    [/store_unit]
    {VARIABLE aoe_damage $damage_inflicted}
    {VARIABLE_OP aoe_damage multiply {DAMAGE_PCT}}
    {VARIABLE aoe_status "{STATUS}"}
    [foreach]
        array=aoe_targets
        [do]
            [harm_unit]
                [filter]
                    x,y=$aoe_targets[$i].x,$aoe_targets[$i].y
                [/filter]
                amount=$aoe_damage
                damage_type=$weapon.type
                fire_event=yes
                animate=yes
                delay=25
            [/harm_unit]
            # If the target died, grant XP to the attacker
            [if]
                [have_unit]
                    x,y=$aoe_targets[$i].x,$aoe_targets[$i].y
                [/have_unit]
                [then]
                    # Target survived — apply status effect if not "none"
                    [if]
                        [variable]
                            name=aoe_status
                            not_equals=none
                        [/variable]
                        [then]
                            {VARIABLE aoe_immunity "{IMMUNITY}"}
                            [if]
                                [variable]
                                    name=aoe_immunity
                                    not_equals=none
                                [/variable]
                                [then]
                                    # Skip units immune to this status
                                    [modify_unit]
                                        [filter]
                                            id=$aoe_targets[$i].id
                                            [not]
                                                [filter_wml]
                                                    [status]
                                                        {IMMUNITY}=yes
                                                    [/status]
                                                [/filter_wml]
                                            [/not]
                                        [/filter]
                                        [status]
                                            {STATUS}=yes
                                        [/status]
                                    [/modify_unit]
                                [/then]
                                [else]
                                    [modify_unit]
                                        [filter]
                                            id=$aoe_targets[$i].id
                                        [/filter]
                                        [status]
                                            {STATUS}=yes
                                        [/status]
                                    [/modify_unit]
                                [/else]
                            [/if]
                            {CLEAR_VARIABLE aoe_immunity}
                        [/then]
                    [/if]
                [/then]
                [else]
                    # Target died — grant XP (min 4, otherwise level × 8)
                    {VARIABLE aoe_exp $aoe_targets[$i].level}
                    {VARIABLE_OP aoe_exp multiply 8}
                    {VARIABLE_OP unit.experience add "$(max(4, $aoe_exp))"}
                    {CLEAR_VARIABLE aoe_exp}
                    [unstore_unit]
                        variable=unit
                        find_vacant=no
                    [/unstore_unit]
                [/else]
            [/if]
        [/do]
    [/foreach]
    {CLEAR_VARIABLE aoe_targets}
    {CLEAR_VARIABLE aoe_damage}
    {CLEAR_VARIABLE aoe_status}
[/event]
#enddef

# Toxic Spores: when a unit with toxic_spores is attacked, the attacker is poisoned.
# Fires at end of combat. Global event registered via resource tag.
#define MYCELIUM_TOXIC_SPORES_EVENT
[event]
    name=attack_end
    id=mycelium_toxic_spores
    first_time_only=no
    [filter_second]
        [filter_wml]
            [abilities]
                [dummy]
                    id=toxic_spores
                [/dummy]
            [/abilities]
        [/filter_wml]
    [/filter_second]
    {APPLY_POISON id=$unit.id}
[/event]
#enddef

# Unhealable cleanup: unlike slowed/poisoned, the engine does NOT auto-clear
# unhealable each turn. A companion tagging event marks units hit by the blight
# AoE with a unit variable, and the cleanup only clears unhealable from units
# with that tag — so other sources of unhealable are left untouched.
# The tag is named "blight" so any future blight-based ability can reuse it.
# Used with: {AOE_EVENT blight 0.5 unhealable}
# Also used with: {WEAPON_SPECIAL_BLIGHT} + {MYCELIUM_BLIGHT_EVENT}
#define MYCELIUM_UNHEALABLE_CLEANUP_EVENT
# Tag: mark units hit by blight AoE so cleanup can identify them
[event]
    name=attacker_hits
    id=aoe_blight_tag
    first_time_only=no
    [filter_attack]
        special_id=aoe_blight
    [/filter_attack]
    [modify_unit]
        [filter]
            [filter_adjacent]
                x,y=$x2,$y2
            [/filter_adjacent]
            [not]
                x,y=$x2,$y2
            [/not]
            [filter_side]
                [enemy_of]
                    side=$unit.side
                [/enemy_of]
            [/filter_side]
        [/filter]
        [variables]
            blight=yes
        [/variables]
    [/modify_unit]
[/event]

# Cleanup: only clear unhealable from units tagged with blight
[event]
    name=side turn
    id=aoe_blight_cleanup
    first_time_only=no
    [modify_unit]
        [filter]
            side=$side_number
            [filter_wml]
                [variables]
                    blight=yes
                [/variables]
            [/filter_wml]
        [/filter]
        [status]
            unhealable=no
        [/status]
        [variables]
            blight=no
        [/variables]
    [/modify_unit]
[/event]
#enddef

# Single-target Blight: on hit, the target becomes unhealable until its next turn.
# Uses the same "blight" tag as the AoE version for shared cleanup.
# Usage: {WEAPON_SPECIAL_BLIGHT} in a [specials] block.
# Must register {MYCELIUM_BLIGHT_EVENT} in resource tags.
#define WEAPON_SPECIAL_BLIGHT
    [dummy]
        id=blight
        name= _ "blight"
        description= _ "When this attack hits, the target becomes unhealable until its next turn. Unhealable units cannot be healed by healers, villages, or resting."
    [/dummy]
#enddef

#define MYCELIUM_BLIGHT_EVENT
[event]
    name=attacker_hits
    id=blight_single
    first_time_only=no
    [filter_attack]
        special_id=blight
    [/filter_attack]
    [modify_unit]
        [filter]
            x,y=$x2,$y2
        [/filter]
        [status]
            unhealable=yes
        [/status]
        [variables]
            blight=yes
        [/variables]
    [/modify_unit]
[/event]
#enddef
