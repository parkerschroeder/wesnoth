#textdomain wesnoth-Fractured_Realms

# ============================================================
# Lycanthropic Bite — weapon special
# ============================================================
# Marks the target with lycanthropy when the attack hits.
# The actual transformation logic is handled by the nightfall/dawn events below.
# Usage: {WEAPON_SPECIAL_LYCANTHROPIC_BITE} in a [specials] block.

#define WEAPON_SPECIAL_LYCANTHROPIC_BITE
    [dummy]
        id=lycanthropic_bite
        name= _ "lycanthropic bite"
        description= _ "This attack curses the target with lycanthropy. Cursed units transform into werefolk at nightfall and revert at dawn. Cured by villages or healers with 'cures'."
    [/dummy]
#enddef

# ============================================================
# Helper Macros — shared building blocks for lycanthropy logic
# ============================================================

# Apply the lycanthropy curse to a unit (status marker + owner tracking).
# The visual indicator is handled by Lua (theme.lua status icon).
# Usage: {LYCANTHROPY_APPLY_CURSE X Y OWNER_SIDE}
#define LYCANTHROPY_APPLY_CURSE X Y OWNER_SIDE
    [modify_unit]
        [filter]
            x,y={X},{Y}
        [/filter]
        [variables]
            lycanthropy_owner={OWNER_SIDE}
        [/variables]
    [/modify_unit]
    [object]
        id=lycanthropy_curse
        take_only_once=no
        silent=yes
        [filter]
            x,y={X},{Y}
        [/filter]
        [effect]
            apply_to=status
            add=lycanthropy
        [/effect]
    [/object]
#enddef

# Remove the lycanthropy curse from a unit and clean up all tracking variables.
# Usage: {LYCANTHROPY_REMOVE_CURSE X Y}
#define LYCANTHROPY_REMOVE_CURSE X Y
    [remove_object]
        object_id=lycanthropy_curse
        [filter]
            x,y={X},{Y}
        [/filter]
    [/remove_object]
    [modify_unit]
        [filter]
            x,y={X},{Y}
        [/filter]
        [status]
            lycanthropy=no
        [/status]
        [variables]
            lycanthropy_owner=
            lycanthropy_original_side=
            lycanthropy_transformed=
        [/variables]
    [/modify_unit]
#enddef

# Apply the nightfall transformation (switch unit type to Werefolk_Cursed, switch side).
# Stores the unit's original side and type. The object handles image + attacks via type change.
# Usage: {LYCANTHROPY_APPLY_TRANSFORM X Y ORIGINAL_SIDE OWNER_SIDE}
#define LYCANTHROPY_APPLY_TRANSFORM X Y ORIGINAL_SIDE OWNER_SIDE
    # Snapshot original stats before type change
    [store_unit]
        [filter]
            x,y={X},{Y}
        [/filter]
        variable=lycanthropy_transform_temp
        kill=no
    [/store_unit]
    [modify_unit]
        [filter]
            x,y={X},{Y}
        [/filter]
        [variables]
            lycanthropy_original_side={ORIGINAL_SIDE}
            lycanthropy_original_hitpoints=$lycanthropy_transform_temp.hitpoints
            lycanthropy_original_max_hitpoints=$lycanthropy_transform_temp.max_hitpoints
            lycanthropy_original_experience=$lycanthropy_transform_temp.experience
            lycanthropy_original_max_experience=$lycanthropy_transform_temp.max_experience
            lycanthropy_transformed=yes
        [/variables]
    [/modify_unit]
    # Switch to cursed wolf form (image + attacks come from unit type)
    [object]
        id=lycanthropy_transform
        take_only_once=no
        silent=yes
        [filter]
            x,y={X},{Y}
        [/filter]
        [effect]
            apply_to=type
            name=Werefolk_Cursed
        [/effect]
    [/object]
    # Restore original HP/XP onto the new form and switch side
    [modify_unit]
        [filter]
            x,y={X},{Y}
        [/filter]
        side={OWNER_SIDE}
        hitpoints=$lycanthropy_transform_temp.hitpoints
        max_hitpoints=$lycanthropy_transform_temp.max_hitpoints
        experience=$lycanthropy_transform_temp.experience
        max_experience=$lycanthropy_transform_temp.max_experience
    [/modify_unit]
    {CLEAR_VARIABLE lycanthropy_transform_temp}
#enddef

# Remove the nightfall transformation and revert the unit to its original type and side.
# [remove_object] reverses the apply_to=type effect, restoring the original unit type.
# Usage: {LYCANTHROPY_REMOVE_TRANSFORM X Y ORIGINAL_SIDE}
#define LYCANTHROPY_REMOVE_TRANSFORM X Y ORIGINAL_SIDE
    # Snapshot current stats before reverting (need current HP and stored original maximums)
    [store_unit]
        [filter]
            x,y={X},{Y}
        [/filter]
        variable=lycanthropy_revert_temp
        kill=no
    [/store_unit]
    [remove_object]
        object_id=lycanthropy_transform
        [filter]
            x,y={X},{Y}
        [/filter]
    [/remove_object]
    # Restore side, carry current HP, restore original maximums
    [modify_unit]
        [filter]
            x,y={X},{Y}
        [/filter]
        side={ORIGINAL_SIDE}
        hitpoints=$lycanthropy_revert_temp.hitpoints
        max_hitpoints=$lycanthropy_revert_temp.variables.lycanthropy_original_max_hitpoints
        experience=$lycanthropy_revert_temp.experience
        max_experience=$lycanthropy_revert_temp.variables.lycanthropy_original_max_experience
        [variables]
            lycanthropy_transformed=no
        [/variables]
    [/modify_unit]
    {CLEAR_VARIABLE lycanthropy_revert_temp}
#enddef

# Store the current time of day and execute BODY if it matches TOD_ID.
# Usage: {IF_TIME_OF_DAY tod_id (body...)}
#define IF_TIME_OF_DAY TOD_ID BODY
    [store_time_of_day]
    [/store_time_of_day]
    [if]
        [variable]
            name=time_of_day.id
            equals={TOD_ID}
        [/variable]
        [then]
            {BODY}
        [/then]
    [/if]
#enddef

# ============================================================
# Lycanthropy Events — one macro per event
# ============================================================

# Bite: apply lycanthropy curse when a lycanthropic attack hits.
# Skips undead, mechanical, and already-cursed units.
# Two events cover both offensive (attacker_hits) and defensive (defender_hits) bites.
#define LYCANTHROPY_BITE_EVENT
# Offensive bite: biter is the attacker, target is the defender
[event]
    name=attacker_hits
    first_time_only=no
    id=lycanthropy_bite_attack

    [filter_attack]
        special_id=lycanthropic_bite
    [/filter_attack]

    [filter_second]
        [not]
            race=undead,mechanical
        [/not]
        [not]
            status=lycanthropy
        [/not]
    [/filter_second]

    {LYCANTHROPY_APPLY_CURSE $second_unit.x $second_unit.y $unit.side}

    [floating_text]
        x,y=$second_unit.x,$second_unit.y
        text= _ "<span color='#cc44ff'>lycanthropy</span>"
    [/floating_text]
[/event]

# Defensive bite: biter is the defender ($second_unit), target is the attacker ($unit)
[event]
    name=defender_hits
    first_time_only=no
    id=lycanthropy_bite_defend

    [filter_second_attack]
        special_id=lycanthropic_bite
    [/filter_second_attack]

    [filter]
        [not]
            race=undead,mechanical
        [/not]
        [not]
            status=lycanthropy
        [/not]
    [/filter]

    {LYCANTHROPY_APPLY_CURSE $unit.x $unit.y $second_unit.side}

    [floating_text]
        x,y=$unit.x,$unit.y
        text= _ "<span color='#cc44ff'>lycanthropy</span>"
    [/floating_text]
[/event]
#enddef

# Nightfall: transform all cursed (non-transformed) units into werefolk at first watch.
#define LYCANTHROPY_NIGHTFALL_EVENT
[event]
    name=turn refresh
    first_time_only=no
    id=lycanthropy_nightfall

    {IF_TIME_OF_DAY first_watch (
        [store_unit]
            [filter]
                status=lycanthropy
                [not]
                    [filter_wml]
                        [variables]
                            lycanthropy_transformed=yes
                        [/variables]
                    [/filter_wml]
                [/not]
            [/filter]
            variable=lycanthropy_to_transform
            kill=no
        [/store_unit]

        [foreach]
            array=lycanthropy_to_transform
            variable=cursed
            [do]
                {LYCANTHROPY_APPLY_TRANSFORM $cursed.x $cursed.y $cursed.side $cursed.variables.lycanthropy_owner}
            [/do]
        [/foreach]

        [redraw][/redraw]
        {CLEAR_VARIABLE lycanthropy_to_transform}
    )}
[/event]
#enddef

# Dawn: revert all transformed units back to their original side and form.
#define LYCANTHROPY_DAWN_EVENT
[event]
    name=turn refresh
    first_time_only=no
    id=lycanthropy_dawn

    {IF_TIME_OF_DAY dawn (
        [store_unit]
            [filter]
                [filter_wml]
                    [variables]
                        lycanthropy_transformed=yes
                    [/variables]
                [/filter_wml]
            [/filter]
            variable=lycanthropy_to_revert
            kill=no
        [/store_unit]

        [foreach]
            array=lycanthropy_to_revert
            variable=transformed
            [do]
                {LYCANTHROPY_REMOVE_TRANSFORM $transformed.x $transformed.y $transformed.variables.lycanthropy_original_side}
            [/do]
        [/foreach]

        [redraw][/redraw]
        {CLEAR_VARIABLE lycanthropy_to_revert}
    )}
[/event]
#enddef

# Village cure: remove lycanthropy from non-transformed cursed units on villages.
#define LYCANTHROPY_VILLAGE_CURE_EVENT
[event]
    name=turn refresh
    first_time_only=no
    id=lycanthropy_village_cure

    [store_unit]
        [filter]
            side=$side_number
            status=lycanthropy
            [not]
                [filter_wml]
                    [variables]
                        lycanthropy_transformed=yes
                    [/variables]
                [/filter_wml]
            [/not]
            [filter_location]
                terrain=*^V*
            [/filter_location]
        [/filter]
        variable=lycanthropy_to_cure
        kill=no
    [/store_unit]

    [foreach]
        array=lycanthropy_to_cure
        variable=cured
        [do]
            {LYCANTHROPY_REMOVE_CURSE $cured.x $cured.y}
        [/do]
    [/foreach]

    {CLEAR_VARIABLE lycanthropy_to_cure}
[/event]
#enddef

# ============================================================
# Composer — inject all lycanthropy events
# ============================================================
# Use {LYCANTHROPY_EVENTS} in a [resource] or scenario to wire in all events.

#define LYCANTHROPY_EVENTS
    {LYCANTHROPY_BITE_EVENT}
    {LYCANTHROPY_NIGHTFALL_EVENT}
    {LYCANTHROPY_DAWN_EVENT}
    {LYCANTHROPY_VILLAGE_CURE_EVENT}
#enddef
