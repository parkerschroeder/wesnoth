#textdomain wesnoth-Fractured_Realms

# ============================================================
# Lycanthropic Bite — weapon special
# ============================================================
# Marks the target with festering lycanthropy when the attack hits.
# The actual transformation logic is handled by the nightfall/dawn events below.
# Usage: {WEAPON_SPECIAL_LYCANTHROPIC_BITE} in a [specials] block.

#define WEAPON_SPECIAL_LYCANTHROPIC_BITE
    [dummy]
        id=lycanthropic_bite
        name= _ "lycanthropic bite"
        description= _ "This attack inflicts a festering curse on the target. If not cured by a village or healer before nightfall, the curse takes root permanently — the unit will transform into a werefolk every night."
    [/dummy]
#enddef

# ============================================================
# Helper Macros — shared building blocks
# ============================================================

# Apply the festering status to a unit (generic curable pre-curse phase).
# Stores the target affliction (e.g. "lycanthropy") and the owner side.
# The unit is also marked unhealable until cured or the curse takes root.
# Usage: {APPLY_FESTERING X Y OWNER_SIDE TARGET}
#define APPLY_FESTERING X Y OWNER_SIDE TARGET
    [modify_unit]
        [filter]
            x,y={X},{Y}
        [/filter]
        [variables]
            festering_owner={OWNER_SIDE}
            festering_target={TARGET}
        [/variables]
    [/modify_unit]
    [object]
        id=festering_curse
        take_only_once=no
        silent=yes
        [filter]
            x,y={X},{Y}
        [/filter]
        [effect]
            apply_to=status
            add=festering
        [/effect]
        [effect]
            apply_to=status
            add=unhealable
        [/effect]
    [/object]
#enddef

# Remove the festering status from a unit and clean up tracking variables.
# Usage: {REMOVE_FESTERING X Y}
#define REMOVE_FESTERING X Y
    [remove_object]
        object_id=festering_curse
        [filter]
            x,y={X},{Y}
        [/filter]
    [/remove_object]
    [modify_unit]
        [filter]
            x,y={X},{Y}
        [/filter]
        [status]
            festering=no
            unhealable=no
        [/status]
        [variables]
            festering_owner=
            festering_target=
        [/variables]
    [/modify_unit]
#enddef

# Apply permanent lycanthropy to a unit (replaces festering, not curable).
# Usage: {APPLY_LYCANTHROPY X Y OWNER_SIDE}
#define APPLY_LYCANTHROPY X Y OWNER_SIDE
    # Remove the festering phase first
    {REMOVE_FESTERING {X} {Y}}
    # Apply permanent lycanthropy status
    [modify_unit]
        [filter]
            x,y={X},{Y}
        [/filter]
        [status]
            lycanthropy=yes
        [/status]
        [variables]
            lycanthropy_owner={OWNER_SIDE}
        [/variables]
    [/modify_unit]
#enddef

# Apply the nightfall transformation (switch unit type to Werefolk_Cursed, switch side).
# Stores the unit's original side and stats. The object handles image + attacks via type change.
# Usage: {LYCANTHROPY_APPLY_TRANSFORM X Y ORIGINAL_SIDE OWNER_SIDE}
#define LYCANTHROPY_APPLY_TRANSFORM X Y ORIGINAL_SIDE OWNER_SIDE
    # Snapshot original stats before type change
    [store_unit]
        [filter]
            x,y={X},{Y}
        [/filter]
        variable=lycanthropy_transform_temp
        kill=no
    [/store_unit]
    [modify_unit]
        [filter]
            x,y={X},{Y}
        [/filter]
        [variables]
            lycanthropy_original_side={ORIGINAL_SIDE}
            lycanthropy_original_hitpoints=$lycanthropy_transform_temp.hitpoints
            lycanthropy_original_max_hitpoints=$lycanthropy_transform_temp.max_hitpoints
            lycanthropy_original_experience=$lycanthropy_transform_temp.experience
            lycanthropy_original_max_experience=$lycanthropy_transform_temp.max_experience
            lycanthropy_transformed=yes
        [/variables]
    [/modify_unit]
    # Switch to cursed wolf form (image + attacks come from unit type)
    [object]
        id=lycanthropy_transform
        take_only_once=no
        silent=yes
        [filter]
            x,y={X},{Y}
        [/filter]
        [effect]
            apply_to=type
            name=Werefolk_Cursed
        [/effect]
    [/object]
    # Restore original HP/XP onto the new form and switch side
    [modify_unit]
        [filter]
            x,y={X},{Y}
        [/filter]
        side={OWNER_SIDE}
        hitpoints=$lycanthropy_transform_temp.hitpoints
        max_hitpoints=$lycanthropy_transform_temp.max_hitpoints
        experience=$lycanthropy_transform_temp.experience
        max_experience=$lycanthropy_transform_temp.max_experience
    [/modify_unit]
    {CLEAR_VARIABLE lycanthropy_transform_temp}
#enddef

# Remove the nightfall transformation and revert the unit to its original type and side.
# [remove_object] reverses the apply_to=type effect, restoring the original unit type.
# Usage: {LYCANTHROPY_REMOVE_TRANSFORM X Y ORIGINAL_SIDE}
#define LYCANTHROPY_REMOVE_TRANSFORM X Y ORIGINAL_SIDE
    # Snapshot current stats before reverting (need current HP and stored original maximums)
    [store_unit]
        [filter]
            x,y={X},{Y}
        [/filter]
        variable=lycanthropy_revert_temp
        kill=no
    [/store_unit]
    [remove_object]
        object_id=lycanthropy_transform
        [filter]
            x,y={X},{Y}
        [/filter]
    [/remove_object]
    # Restore side, carry current HP, restore original maximums
    [modify_unit]
        [filter]
            x,y={X},{Y}
        [/filter]
        side={ORIGINAL_SIDE}
        hitpoints=$lycanthropy_revert_temp.hitpoints
        max_hitpoints=$lycanthropy_revert_temp.variables.lycanthropy_original_max_hitpoints
        experience=$lycanthropy_revert_temp.experience
        max_experience=$lycanthropy_revert_temp.variables.lycanthropy_original_max_experience
        [variables]
            lycanthropy_transformed=no
        [/variables]
    [/modify_unit]
    {CLEAR_VARIABLE lycanthropy_revert_temp}
#enddef

# Store the current time of day and execute BODY if it matches TOD_ID.
# Usage: {IF_TIME_OF_DAY tod_id (body...)}
#define IF_TIME_OF_DAY TOD_ID BODY
    [store_time_of_day]
    [/store_time_of_day]
    [if]
        [variable]
            name=time_of_day.id
            equals={TOD_ID}
        [/variable]
        [then]
            {BODY}
        [/then]
    [/if]
#enddef

# ============================================================
# Lycanthropy Events — one macro per event
# ============================================================

# Bite: apply festering lycanthropy when a lycanthropic attack hits.
# Skips undead, mechanical, and units already festering or lycanthropic.
# Two events cover both offensive (attacker_hits) and defensive (defender_hits) bites.
#define LYCANTHROPY_BITE_EVENT
# Offensive bite: biter is the attacker, target is the defender
[event]
    name=attacker_hits
    first_time_only=no
    id=lycanthropy_bite_attack

    [filter_attack]
        special_id=lycanthropic_bite
    [/filter_attack]

    [filter_second]
        [not]
            race=undead,mechanical
        [/not]
        [not]
            status=festering
        [/not]
        [not]
            status=lycanthropy
        [/not]
    [/filter_second]

    {APPLY_FESTERING $second_unit.x $second_unit.y $unit.side lycanthropy}

    [floating_text]
        x,y=$second_unit.x,$second_unit.y
        text= _ "<span color='#cc44ff'>lycanthropy</span>"
    [/floating_text]
[/event]

# Defensive bite: biter is the defender ($second_unit), target is the attacker ($unit)
[event]
    name=defender_hits
    first_time_only=no
    id=lycanthropy_bite_defend

    [filter_second_attack]
        special_id=lycanthropic_bite
    [/filter_second_attack]

    [filter]
        [not]
            race=undead,mechanical
        [/not]
        [not]
            status=festering
        [/not]
        [not]
            status=lycanthropy
        [/not]
    [/filter]

    {APPLY_FESTERING $unit.x $unit.y $second_unit.side lycanthropy}

    [floating_text]
        x,y=$unit.x,$unit.y
        text= _ "<span color='#cc44ff'>lycanthropy</span>"
    [/floating_text]
[/event]
#enddef

# Nightfall: convert festering lycanthropy to permanent, then transform all
# lycanthropic (non-transformed) units into werefolk. Runs on the unit's own turn.
#define LYCANTHROPY_NIGHTFALL_EVENT
[event]
    name=turn refresh
    first_time_only=no
    id=lycanthropy_nightfall

    {IF_TIME_OF_DAY first_watch (
        # Phase 1: Convert festering lycanthropy to permanent lycanthropy
        [store_unit]
            [filter]
                side=$side_number
                status=festering
                [filter_wml]
                    [variables]
                        festering_target=lycanthropy
                    [/variables]
                [/filter_wml]
            [/filter]
            variable=festering_to_convert
            kill=no
        [/store_unit]

        [foreach]
            array=festering_to_convert
            variable=fester
            [do]
                {APPLY_LYCANTHROPY $fester.x $fester.y $fester.variables.festering_owner}
            [/do]
        [/foreach]

        {CLEAR_VARIABLE festering_to_convert}

        # Phase 2: Transform all lycanthropic units not yet in wolf form
        [store_unit]
            [filter]
                side=$side_number
                status=lycanthropy
                [not]
                    [filter_wml]
                        [variables]
                            lycanthropy_transformed=yes
                        [/variables]
                    [/filter_wml]
                [/not]
            [/filter]
            variable=lycanthropy_to_transform
            kill=no
        [/store_unit]

        [foreach]
            array=lycanthropy_to_transform
            variable=cursed
            [do]
                {LYCANTHROPY_APPLY_TRANSFORM $cursed.x $cursed.y $cursed.side $cursed.variables.lycanthropy_owner}
            [/do]
        [/foreach]

        [redraw][/redraw]
        {CLEAR_VARIABLE lycanthropy_to_transform}
    )}
[/event]
#enddef

# Dawn: revert transformed units back to their original side and form, on the werefolk
# player's turn (transformed units are on the werefolk side during the night).
#define LYCANTHROPY_DAWN_EVENT
[event]
    name=turn refresh
    first_time_only=no
    id=lycanthropy_dawn

    {IF_TIME_OF_DAY dawn (
        [store_unit]
            [filter]
                side=$side_number
                [filter_wml]
                    [variables]
                        lycanthropy_transformed=yes
                    [/variables]
                [/filter_wml]
            [/filter]
            variable=lycanthropy_to_revert
            kill=no
        [/store_unit]

        [foreach]
            array=lycanthropy_to_revert
            variable=transformed
            [do]
                {LYCANTHROPY_REMOVE_TRANSFORM $transformed.x $transformed.y $transformed.variables.lycanthropy_original_side}
            [/do]
        [/foreach]

        [redraw][/redraw]
        {CLEAR_VARIABLE lycanthropy_to_revert}
    )}
[/event]
#enddef

# Village cure: remove festering from cursed units on villages (on their own turn).
#define FESTERING_VILLAGE_CURE_EVENT
[event]
    name=turn refresh
    first_time_only=no
    id=festering_village_cure

    [store_unit]
        [filter]
            side=$side_number
            status=festering
            [filter_location]
                terrain=*^V*
            [/filter_location]
        [/filter]
        variable=festering_to_cure
        kill=no
    [/store_unit]

    [foreach]
        array=festering_to_cure
        variable=cured
        [do]
            {REMOVE_FESTERING $cured.x $cured.y}
        [/do]
    [/foreach]

    {CLEAR_VARIABLE festering_to_cure}
[/event]
#enddef

# Healer cure: remove festering from cursed units adjacent to a friendly unit
# with the 'cures' ability (on their own turn).
#define FESTERING_HEALER_CURE_EVENT
[event]
    name=turn refresh
    first_time_only=no
    id=festering_healer_cure

    [store_unit]
        [filter]
            side=$side_number
            status=festering
            [filter_adjacent]
                side=$side_number
                ability=cures
            [/filter_adjacent]
        [/filter]
        variable=festering_healer_cured
        kill=no
    [/store_unit]

    [foreach]
        array=festering_healer_cured
        variable=cured
        [do]
            {REMOVE_FESTERING $cured.x $cured.y}
        [/do]
    [/foreach]

    {CLEAR_VARIABLE festering_healer_cured}
[/event]
#enddef

# Regenerate cure: units with the 'regenerates' ability fight off festering naturally,
# just as regeneration clears poison in the base game.
#define FESTERING_REGENERATE_CURE_EVENT
[event]
    name=turn refresh
    first_time_only=no
    id=festering_regenerate_cure

    [store_unit]
        [filter]
            side=$side_number
            status=festering
            ability=regenerates
        [/filter]
        variable=festering_regen_cured
        kill=no
    [/store_unit]

    [foreach]
        array=festering_regen_cured
        variable=cured
        [do]
            {REMOVE_FESTERING $cured.x $cured.y}
        [/do]
    [/foreach]

    {CLEAR_VARIABLE festering_regen_cured}
[/event]
#enddef

# ============================================================
# Composer — inject all lycanthropy events
# ============================================================
# Use {LYCANTHROPY_EVENTS} in a [resource] or scenario to wire in all events.
# Cure events MUST come before nightfall so units have a chance to be purified
# before the first transformation locks in permanent lycanthropy.

#define LYCANTHROPY_EVENTS
    {LYCANTHROPY_BITE_EVENT}
    {FESTERING_VILLAGE_CURE_EVENT}
    {FESTERING_HEALER_CURE_EVENT}
    {FESTERING_REGENERATE_CURE_EVENT}
    {LYCANTHROPY_NIGHTFALL_EVENT}
    {LYCANTHROPY_DAWN_EVENT}
#enddef
