#textdomain wesnoth-Fractured_Realms

# Fungal Growth trait — musthave for all mushroom race units.
# Other traits (TRAIT_HARDY, TRAIT_RESISTANT, TRAIT_OBEDIENT) are imported
# from WoL via {~add-ons/War_of_Legends/macros/traits.cfg} in _main.cfg.

#define TRAIT_FUNGAL_GROWTH
    [trait]
        id=fungal_growth
        availability="musthave"
        male_name= _ "fungal growth"
        description= _ "This unit spreads Mushroom Grove beneath it at the start of each turn. The unit regenerates 2 HP per turn while on Mushroom Grove. Mushroom Groves provide superior defense for fungal units."
    [/trait]
#enddef
