#textdomain wesnoth-Fractured_Realms

# Mycelium faction events — loaded via [load_resource] in the FR era
[resource]
    id=Mycelium_resource_fungal_spread

    {MYCELIUM_PASSIVE_SPREAD_EVENT}
    {MYCELIUM_OVERGROWTH_EVENT}
    {MYCELIUM_KILL_SPREAD_EVENT}
    {MYCELIUM_GROVE_REANIMATION_EVENT}
    {MYCELIUM_DEATH_BLOOM_EVENT}
    {AOE_EVENT spore_cloud 0.5 slowed none}
    {AOE_EVENT blight 0.5 unhealable none}
    {AOE_EVENT poison_cloud 0.5 poisoned unpoisonable}
    {AOE_EVENT lightning_storm 0.7 none none}
    {MYCELIUM_UNHEALABLE_CLEANUP_EVENT}
    {MYCELIUM_BLIGHT_EVENT}
    {MYCELIUM_TOXIC_SPORES_EVENT}
    {MYCELIUM_GROVE_CONSUMPTION_EVENT}

    # Disengage: after attacking, the unit gets 1 movement point back to retreat/reposition.
    # Based on World Conquest / Under the Burning Suns implementation.
    [event]
        name=attack end
        first_time_only=no
        id=mycelium_disengage_attack_end

        [filter]
            ability=disengage
        [/filter]

        {VARIABLE unit.moves 1}

        [unstore_unit]
            variable=unit
            find_vacant=no
        [/unstore_unit]
    [/event]
[/resource]

# Werefolk faction events — loaded via [load_resource] in the FR era
[resource]
    id=Werefolk_resource_lycanthropy

    [event]
        name=preload
        first_time_only=no
        [lua]
            code= << wesnoth.require "~add-ons/Fractured_Realms/lua/theme.lua" >>
        [/lua]
    [/event]

    {LYCANTHROPY_EVENTS}
[/resource]
