#textdomain wesnoth-Fractured_Realms

[textdomain]
    name="wesnoth-Fractured_Realms"
    path="data/add-ons/Fractured_Realms/translations"
[/textdomain]

[language]
    # type_any= _ "type^any"
    type_arcane_focus= _ "type^arcane focus"
    type_electric= _ "type^electric"
    type_energy= _ "type^energy"
    type_natural= _ "type^natural"
    type_water= _ "type^water"
    type_light= _ "type^light"
    # special_note_type_any=_"This unit has an attack that always deals whichever damage type its opponent is most vulnerable to."
    special_note_type_electric="This unit has an electric attack which behaves differently from the <i>fire</i> damage type."
    special_note_type_energy="This unit has an energy attack which behaves differently from the <i>arcane</i> damage type."
[/language]

#ifdef MULTIPLAYER
[binary_path]
    path=data/add-ons/Fractured_Realms
[/binary_path]

#define WOL_SIDE ERA FACTION
    {~add-ons/Fractured_Realms/factions/{ERA}/{FACTION}-{ERA}.cfg}
#enddef

{~add-ons/Fractured_Realms/macros}
{~add-ons/Fractured_Realms/eras}

{~add-ons/Fractured_Realms/mods/multiplayer}

#undef WOL_SIDE

[units]
    #this is working as intended
    [resistance_defaults]
        id="electric"
        default="100"
        undeadfly=130
        undeadfoot=130
        undeadspirit=110
        gruefoot=110
    [/resistance_defaults]

    [resistance_defaults]
        id="energy"
        default="120"
    [/resistance_defaults]

    [resistance_defaults]
        id="arcane_focus"
        default="((200 - arcane)+10)"
    [/resistance_defaults]

    {~add-ons/Fractured_Realms/units}
[/units]
#endif

#ifdef EDITOR
[binary_path]
    path=data/add-ons/Fractured_Realms
[/binary_path]

{~add-ons/Fractured_Realms/macros}
[+units]
    {~add-ons/Fractured_Realms/units}
[/units]
#endif

#define LEGEND_CAMPAIGN

    [binary_path]
        path="data/add-ons/Fractured_Realms"
    [/binary_path]

    {~add-ons/Fractured_Realms/macros}

    [+units]
        {~add-ons/Fractured_Realms/units}
    [/units]
#enddef

