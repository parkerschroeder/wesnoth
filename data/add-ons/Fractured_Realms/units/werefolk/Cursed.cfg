#textdomain wesnoth-Fractured_Realms

# Lycanthropy cursed form — units bitten by werefolk transform into this at nightfall.
# This is not a recruitable unit; it exists only as a transformation target for apply_to=type.
[unit_type]
    id=Werefolk_Cursed
    name= _ "Cursed"
    race=werefolk
    image="units/monsters/wolf.png"
    hitpoints=24
    movement_type=wolfpaw
    movement=7
    experience=100
    level=1
    alignment=chaotic
    advances_to=null
    cost=0
    usage=fighter
    do_not_list=yes
    description= _ "A unit twisted by lycanthropy into a feral wolf form. It will revert at dawn."
    die_sound=wolf-die.ogg

    [attack]
        name=claws
        description= _ "claws"
        icon=attacks/claws-animal.png
        type=blade
        range=melee
        damage=5
        number=3
        [specials]
            {WEAPON_SPECIAL_LYCANTHROPIC_BITE}
        [/specials]
    [/attack]
[/unit_type]
