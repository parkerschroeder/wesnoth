#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Werefolk_Thrall
    name= _ "Thrall"
    race=werefolk
    image="units/monsters/wolf.png"
    hitpoints=16
    movement_type=wolfpaw
    movement=6
    experience=16
    level=0
    alignment=chaotic
    advances_to=Werefolk_Warg
    cost=8
    usage=fighter
    description= _ "A newly turned werefolk, feral and barely in control. Its claws carry the same curse that created it. When spawned from a nightfall transformation, the Thrall is temporary — reverting at dawn. If killed in beast form, the original is lost forever."
    die_sound=wolf-die.ogg

    [attack]
        name=claws
        description= _ "claws"
        icon=attacks/claws-animal.png
        type=blade
        range=melee
        damage=3
        number=3
        [specials]
            {WEAPON_SPECIAL_LYCANTHROPIC_BITE}
        [/specials]
    [/attack]

    [defend]
        [if]
            hits=hit
            [frame]
                image="units/monsters/wolf.png"
                duration=300
                sound=wolf-hit.ogg
            [/frame]
        [/if]
        [if]
            hits=miss
            [frame]
                image="units/monsters/wolf.png"
                duration=300
            [/frame]
        [/if]
    [/defend]
    [death]
        [frame]
            image="units/monsters/wolf.png"
            duration=400
            sound=wolf-die.ogg
        [/frame]
    [/death]
[/unit_type]
