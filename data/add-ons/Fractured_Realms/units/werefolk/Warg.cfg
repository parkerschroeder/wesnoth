#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Werefolk_Warg
    name= _ "Warg"
    race=werefolk
    image="units/monsters/wolf-great.png"
    hitpoints=34
    movement_type=wolfpaw
    movement=7
    experience=38
    level=1
    alignment=chaotic
    advances_to=null
    cost=15
    usage=fighter
    description= _ "A massive wolf, fast and savage. Its cursed bite spreads lycanthropy to any it wounds — dooming them to transform at nightfall."
    die_sound=wolf-die.ogg

    [attack]
        name=fangs
        description= _ "fangs"
        icon=attacks/fangs-animal.png
        type=blade
        range=melee
        damage=6
        number=3
        [specials]
            {WEAPON_SPECIAL_LYCANTHROPIC_BITE}
        [/specials]
    [/attack]

    [defend]
        [if]
            hits=hit
            [frame]
                image="units/monsters/wolf-great.png"
                duration=300
                sound=wolf-hit.ogg
            [/frame]
        [/if]
        [if]
            hits=miss
            [frame]
                image="units/monsters/wolf-great.png"
                duration=300
            [/frame]
        [/if]
    [/defend]
    [death]
        [frame]
            image="units/monsters/wolf-great.png"
            duration=400
            sound=wolf-die.ogg
        [/frame]
    [/death]
[/unit_type]
