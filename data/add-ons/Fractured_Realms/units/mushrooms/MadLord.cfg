#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Mad_Lord
    name= _ "Mad Lord"
    race=dwarf
    image="units/dwarves/berserker.png"
    hitpoints=60
    movement_type=dwarvishfoot
    movement=5
    experience=150
    level=3
    alignment=chaotic
    advances_to=null
    {AMLA_DEFAULT}
    cost=46
    usage=fighter
    description= _ "The Mad Lord has crossed a threshold from which there is no return. The fly agaric no longer merely fuels frenzy — it has fused with the dwarf's very being, transforming them into a walking blight upon the battlefield. Where the Mad Prince commands through dread alone, the Mad Lord's fungal corruption runs so deep that those slain by their hand do not rest — their bodies erupt with spores, rising as mindless thralls of the mycelium. A tyrant enthroned in madness, the Mad Lord reigns over a court of the dead."
    die_sound=dwarf-die.ogg

    [defense]
        fungus=40
        village=60
    [/defense]

    {NOTE_TERROR}

    [abilities]
        {ABILITY_TERROR}
    [/abilities]

    [attack]
        name=mushroom_frenzy
        description= _ "mushroom frenzy"
        icon=attacks/axe.png
        type=blade
        range=melee
        damage=9
        number=4
        [specials]
            {WEAPON_SPECIAL_BERSERK}
            {WEAPON_SPECIAL_GROVE_BOUND}
            {WEAPON_SPECIAL_FUNGAL_PLAGUE}
        [/specials]
    [/attack]
    [attack]
        name=hand_axe
        description= _ "hand axe"
        icon=attacks/axe.png
        type=blade
        range=melee
        damage=9
        number=4
        [specials]
            {WEAPON_SPECIAL_FUNGAL_PLAGUE}
        [/specials]
    [/attack]
[/unit_type]
