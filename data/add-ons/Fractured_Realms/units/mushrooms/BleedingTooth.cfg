#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Bleeding_Tooth
    name= _ "Bleeding Tooth"
    race=mushroom
    image="units/mushrooms/bleedingtooth.png"
    hitpoints=44
    movement_type=fungalfoot
    movement=5
    experience=150
    level=3
    alignment=chaotic
    advances_to=null
    {AMLA_DEFAULT}
    cost=46
    usage=fighter
    description= _ "Named for Hydnellum peckii — the tooth fungus that weeps blood-red droplets from its pores — the Bleeding Tooth is the ultimate expression of the Lion's Mane line's offensive branch. Its blighting spores have grown so concentrated that even its standard volleys choke the life from enemies, and when it channels the grove, the resulting eruption of crimson-stained spores is devastating. Nothing heals in the Bleeding Tooth's presence."
    die_sound=hiss-die.ogg

    [attack]
        name=staff
        description= _ "staff"
        icon=attacks/staff.png
        type=impact
        range=melee
        damage=7
        number=3
        [specials]
            {WEAPON_SPECIAL_BLIGHT}
        [/specials]
    [/attack]
    [attack]
        name=blight_spore
        description= _ "blight spore"
        icon=attacks/mudball.png
        type=impact
        range=ranged
        damage=9
        number=3
        [specials]
            {WEAPON_SPECIAL_BLIGHT}
        [/specials]
    [/attack]
    [attack]
        name=blighting_spores
        description= _ "blighting spores"
        icon=attacks/squall.png
        type=impact
        range=ranged
        damage=9
        number=3
        [specials]
            {WEAPON_SPECIAL_AOE blight "blighting spores" "When this attack hits, all enemies adjacent to the target take 50% splash damage and become unhealable until their next turn. Unhealable units cannot be healed by healers, villages, or resting."}
            {WEAPON_SPECIAL_GROVE_BOUND}
        [/specials]
    [/attack]

    {MUSHROOM_DEFEND "units/mushrooms/bleedingtooth.png" hiss-hit.wav}
    {MUSHROOM_DEATH "units/mushrooms/bleedingtooth.png" hiss-die.ogg}
    {MUSHROOM_ATTACK_MELEE "units/mushrooms/bleedingtooth.png" staff staff.ogg}
    {MUSHROOM_ATTACK_RANGED_MAGIC "units/mushrooms/bleedingtooth.png" blight_spore staff.ogg}
    {MUSHROOM_ATTACK_RANGED_MAGIC "units/mushrooms/bleedingtooth.png" blighting_spores staff.ogg}
[/unit_type]
