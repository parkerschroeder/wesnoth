#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Mad_Prince
    name= _ "Mad Prince"
    race=dwarf
    image="units/dwarves/berserker.png"
    hitpoints=44
    movement_type=dwarvishfoot
    movement=5
    experience=76
    level=2
    alignment=chaotic
    advances_to=Mycelium_Mad_Lord
    cost=28
    usage=fighter
    description= _ "Where the Madcap is a wild-eyed hermit, the Mad Prince is a self-crowned sovereign of delirium. Prolonged communion with fly agaric has granted a terrible clarity beneath the madness — these dwarves carry themselves with imperious certainty, commanding the battlefield through sheer psychic menace. The fungal toxins saturating their bodies radiate outward like a dark courtly aura, withering the courage of all who draw near. Enemies find their hands trembling and their resolve crumbling, as though standing before a wrathful king whose judgment cannot be appealed."
    die_sound=dwarf-die.ogg

    [defense]
        fungus=40
        village=60
    [/defense]

    {NOTE_TERROR}

    [abilities]
        {ABILITY_TERROR}
    [/abilities]

    [attack]
        name=hand_axe
        description= _ "hand axe"
        icon=attacks/axe.png
        type=blade
        range=melee
        damage=7
        number=4
    [/attack]
    [attack]
        name=mushroom_frenzy
        description= _ "mushroom frenzy"
        icon=attacks/axe.png
        type=blade
        range=melee
        damage=7
        number=4
        [specials]
            {WEAPON_SPECIAL_BERSERK}
            {WEAPON_SPECIAL_GROVE_BOUND}
        [/specials]
    [/attack]
[/unit_type]
