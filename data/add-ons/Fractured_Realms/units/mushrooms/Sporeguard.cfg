#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Sporeguard
    name= _ "Sporeguard"
    race=mushroom
    image="units/monsters/giant-mudcrawler.png"
    hitpoints=52
    movement_type=fungalfoot
    movement=4
    experience=100
    level=2
    alignment=chaotic
    advances_to=null
    cost=32
    usage=fighter
    description= _ "A massive toadstool whose hardened cap constantly exudes a thick cloud of numbing spores. When the Sporeguard launches its spore puff attack and lands a hit, the cloud billows outward, slowing all nearby enemies. By channeling the mycelial network beneath a mushroom grove, it can unleash a devastating spore eruption — but the effort consumes the grove entirely."
    die_sound=hiss-die.ogg

    [attack]
        name=club
        description= _ "club"
        icon=attacks/club-small.png
        type=impact
        range=melee
        damage=9
        number=3
        [specials]
            {WEAPON_SPECIAL_FUNGAL_PLAGUE}
        [/specials]
    [/attack]
    [attack]
        name=spore_puff
        description= _ "spore puff"
        icon=attacks/mudball.png
        type=impact
        range=ranged
        damage=6
        number=2
        [specials]
            {WEAPON_SPECIAL_SLOW}
            {WEAPON_SPECIAL_AOE spore_cloud "spore cloud" "When this attack hits, all enemies adjacent to the target take 50% splash damage and are slowed."}
        [/specials]
    [/attack]
    [attack]
        name=spore_eruption
        description= _ "spore eruption"
        icon=attacks/mudball.png
        type=impact
        range=ranged
        damage=8
        number=3
        [specials]
            {WEAPON_SPECIAL_SLOW}
            {WEAPON_SPECIAL_AOE spore_cloud "spore cloud" "When this attack hits, all enemies adjacent to the target take 50% splash damage and are slowed."}
            {WEAPON_SPECIAL_GROVE_BOUND}
        [/specials]
    [/attack]
[/unit_type]
