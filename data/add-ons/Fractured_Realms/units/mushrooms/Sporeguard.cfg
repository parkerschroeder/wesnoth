#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Sporeguard
    name= _ "Sporeguard"
    race=mushroom
    image="units/monsters/giant-mudcrawler.png"
    hitpoints=52
    movement_type=fungalfoot
    movement=4
    experience=100
    level=2
    alignment=chaotic
    advances_to=null
    cost=32
    usage=fighter
    description= _ "A massive toadstool whose hardened cap constantly exudes a thick cloud of numbing spores. When the Sporeguard launches its spore puff attack and lands a hit, the cloud billows outward, slowing all nearby enemies."
    die_sound=hiss-die.ogg

    [abilities]
        [dummy]
            id=spore_cloud
            name= _ "spore cloud"
            female_name= _ "female^spore cloud"
            description= _ "When this unit hits with its ranged attack, all enemy units adjacent to the target are slowed."
        [/dummy]
    [/abilities]

    [attack]
        name=club
        description= _ "club"
        icon=attacks/club-small.png
        type=impact
        range=melee
        damage=9
        number=3
        [specials]
            {WEAPON_SPECIAL_FUNGAL_PLAGUE}
        [/specials]
    [/attack]
    [attack]
        name=spore_puff
        description= _ "spore puff"
        icon=attacks/mudball.png
        type=impact
        range=ranged
        damage=6
        number=2
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    [/attack]
[/unit_type]
