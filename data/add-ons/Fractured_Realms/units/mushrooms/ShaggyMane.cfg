#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Shaggy_Mane
    name= _ "Shaggy Mane"
    race=mushroom
    image="units/mushrooms/shaggymane.png"
    hitpoints=38
    movement_type=fungalfoot
    movement=5
    experience=100
    level=2
    alignment=neutral
    advances_to=Mycelium_Lawyers_Wig
    cost=30
    usage=healer
    description= _ "Named for the shaggy, ink-dripping Coprinus comatus, the Shaggy Mane has mastered the art of dissolution. Where the real mushroom dissolves itself into healing black ink as it matures, this fungus dissolves toxins and ailments from wounded allies. Its enhanced spores not only mend wounds but purge poison and other afflictions — breaking them down the way ink breaks down a page. Where the Lion's Mane merely heals, the Shaggy Mane purifies."
    die_sound=hiss-die.ogg

    [abilities]
        {ABILITY_CURES}
    [/abilities]

    [attack]
        name=staff
        description= _ "staff"
        icon=attacks/staff.png
        type=impact
        range=melee
        damage=5
        number=3
    [/attack]
    [attack]
        name=spore_puff
        description= _ "spore puff"
        icon=attacks/mudball.png
        type=impact
        range=ranged
        damage=5
        number=3
    [/attack]
[/unit_type]
