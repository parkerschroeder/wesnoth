#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Dreadcap
    name= _ "Dreadcap"
    race=dwarf
    image="units/dwarves/berserker.png"
    hitpoints=44
    movement_type=dwarvishfoot
    movement=5
    experience=100
    level=2
    alignment=chaotic
    advances_to=null
    {AMLA_DEFAULT}
    cost=28
    usage=fighter
