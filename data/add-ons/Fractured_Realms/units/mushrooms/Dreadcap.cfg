    die_sound=dwarf-die.ogg

    {NOTE_TERROR}

    [abilities]
        {ABILITY_TERROR}
    [/abilities]

    [attack]
        name=mushroom_frenzy
        description= _ "mushroom frenzy"
        icon=attacks/axe.png
        type=blade
        range=melee
        damage=7
        number=4
        [specials]
            {WEAPON_SPECIAL_BERSERK}
            {WEAPON_SPECIAL_GROVE_BOUND}
        [/specials]
    [/attack]
    [attack]
        name=hand_axe
        description= _ "hand axe"
        icon=attacks/axe.png
        type=blade
        range=melee
        damage=7
        number=4
    [/attack]
[/unit_type]
