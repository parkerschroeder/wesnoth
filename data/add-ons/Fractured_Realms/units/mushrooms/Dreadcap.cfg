#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Dreadcap
    name= _ "Dreadcap"
    race=dwarf
    image="units/dwarves/berserker.png"
    hitpoints=44
    movement_type=dwarvishfoot
    movement=5
    experience=100
    level=2
    alignment=chaotic
    advances_to=null
    {AMLA_DEFAULT}
    cost=28
    usage=fighter
    description= _ "Once merely impulsive, the Madcap's relentless consumption of fly agaric has burned away all restraint. The Dreadcap's frenzies are longer, more savage, and tinged with hallucinatory venom — the mushroom toxins have saturated their flesh so thoroughly that even their hand axe leaves a poisonous residue on every wound."
    die_sound=dwarf-die.ogg

    [attack]
        name=mushroom_frenzy
        description= _ "mushroom frenzy"
        icon=attacks/axe.png
        type=blade
        range=melee
        damage=7
        number=4
        [specials]
            {WEAPON_SPECIAL_BERSERK}
            {WEAPON_SPECIAL_GROVE_BOUND}
        [/specials]
    [/attack]
    [attack]
        name=venomous_axe
        description= _ "venomous axe"
        icon=attacks/axe.png
        type=blade
        range=melee
        damage=6
        number=3
        [specials]
            {WEAPON_SPECIAL_POISON}
        [/specials]
    [/attack]
[/unit_type]
