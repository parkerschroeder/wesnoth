#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Lions_Mane
    name= _ "Lion's Mane"
    race=mushroom
    image="units/monsters/cuttlefish.png"
    hitpoints=26
    movement_type=fungalfoot
    movement=5
    experience=28
    level=1
    alignment=neutral
    advances_to=Mycelium_Morel,Mycelium_Ergot
    cost=14
    usage=healer
    description= _ "A shaggy, cascading mushroom known for its restorative properties. Its spores stimulate nerve regeneration, mending wounded allies nearby."
    die_sound=hiss-die.ogg

    [abilities]
        {ABILITY_HEALS}
    [/abilities]

    [attack]
        name=staff
        description= _ "staff"
        icon=attacks/staff.png
        type=impact
        range=melee
        damage=3
        number=2
    [/attack]
    [attack]
        name=restorative_spores
        description= _ "restorative spores"
        icon=attacks/mudball.png
        type=impact
        range=ranged
        damage=4
        number=2
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    [/attack]
[/unit_type]
