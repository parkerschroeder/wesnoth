#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Glowcap
    name= _ "Glowcap"
    race=mushroom
    image="units/mushrooms/glowcap.png"
    hitpoints=26
    movement_type=fungalfoot
    movement=5
    experience=44
    level=1
    alignment=neutral
    advances_to=Mycelium_Earth_Star,Mycelium_Black_Hole
    cost=16
    usage=archer
    description= _ "A bioluminescent mushroom that channels bioelectric energy through its mycelium. Expensive but devastating at range, the Glowcap discharges crackling bolts that bypass armor."
    die_sound=hiss-die.ogg

    [attack]
        name=spark_bolt
        description= _ "spark bolt"
        icon=attacks/lightning.png
        type=electric
        range=ranged
        damage=9
        number=2
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
    [/attack]

    {MUSHROOM_DEFEND_BLINK "units/mushrooms/glowcap.png" hiss-hit.wav}
    {MUSHROOM_DEATH "units/mushrooms/glowcap.png" hiss-die.ogg}
    {MUSHROOM_ATTACK_RANGED_MAGIC "units/mushrooms/glowcap.png" spark_bolt lightning.ogg}
    {MUSHROOM_IDLE_GLOW "units/mushrooms/glowcap.png"}
[/unit_type]
