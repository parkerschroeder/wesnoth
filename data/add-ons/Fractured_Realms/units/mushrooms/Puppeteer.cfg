#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Puppeteer
    name= _ "Puppeteer"
    race=mushroom
    image="units/dunefolk/rover/explorer.png"
    hitpoints=43
    movement_type=fungalfoot
    movement=5
    experience=75
    level=2
    alignment=chaotic
    advances_to=Mycelium_Hivemind
    cost=32
    usage=mixed fighter
    description= _ "The Puppeteer extends its mycelial threads into the minds of those around it. Allies fight with renewed vigor, draining the life force of their enemies, while foes find their strength sapped by the Puppeteer's insidious Fungal Domination."
    die_sound=hiss-die.ogg

    [abilities]
        [drains]
            id=parasitic_link
            name= _ "parasitic link"
            description= _ "Adjacent allied units drain health from their attacks, healing themselves for half the damage dealt."
            value=50
            affect_self=no
            affect_allies=yes
            [affect_adjacent]
            [/affect_adjacent]
        [/drains]
    [/abilities]

    [attack]
        name=parasitic_touch
        description= _ "parasitic touch"
        icon=attacks/touch-undead.png
        type=blade
        range=melee
        damage=6
        number=3
        [specials]
            {WEAPON_SPECIAL_DRAIN}
        [/specials]
    [/attack]
    [attack]
        name=mind_spore
        description= _ "mind spore"
        icon=attacks/mudball.png
        type=arcane
        range=ranged
        damage=5
        number=3
    [/attack]
[/unit_type]
