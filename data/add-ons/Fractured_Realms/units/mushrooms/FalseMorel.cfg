#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_False_Morel
    name= _ "False Morel"
    race=mushroom
    image="units/mushrooms/falsemorel.png"
    hitpoints=55
    movement_type=fungalfoot
    movement=7
    experience=150
    level=3
    alignment=chaotic
    advances_to=null
    {AMLA_DEFAULT}
    cost=52
    usage=fighter
    description= _ "The False Morel is a swift, towering fungal horror whose mycelial network stretches far beneath the battlefield. Moving with unnatural speed, it rushes to wherever the fighting is thickest to infuse nearby allies with its spore-laden presence. Enemies slain near the False Morel don't merely sprout — they erupt into fully formed Puffballs, volatile suicide bombers that carry the cycle of death and rebirth ever forward."
    die_sound=hiss-die.ogg

    [abilities]
        [plague]
            id=enhanced_fungal_brood
            name= _ "enhanced fungal brood"
            description= _ "Adjacent allied units' attacks spawn Puffballs from slain enemies."
            type=Mycelium_Puffball
            affect_self=no
            affect_allies=yes
            [affect_adjacent]
            [/affect_adjacent]
        [/plague]
    [/abilities]

    [attack]
        name=parasitic_touch
        description= _ "parasitic touch"
        icon=attacks/touch-undead.png
        type=blade
        range=melee
        damage=10
        number=3
        [specials]
            {WEAPON_SPECIAL_FUNGAL_PLAGUE}
        [/specials]
    [/attack]

    {MUSHROOM_DEFEND "units/mushrooms/falsemorel.png" hiss-hit.wav}
    {MUSHROOM_DEATH "units/mushrooms/falsemorel.png" hiss-die.ogg}
    {MUSHROOM_ATTACK_MELEE "units/mushrooms/falsemorel.png" parasitic_touch hiss.wav}
[/unit_type]
