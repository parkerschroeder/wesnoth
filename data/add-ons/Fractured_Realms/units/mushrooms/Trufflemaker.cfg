#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Trufflemaker
    name= _ "Trufflemaker"
    race=mushroom
    image="units/mushrooms/trufflemaker.png"
    hitpoints=58
    movement_type=fungalfoot
    movement=8
    experience=150
    level=3
    alignment=chaotic
    advances_to=null
    {AMLA_DEFAULT}
    cost=46
    usage=scout
    description= _ "The Trufflemaker is a massive, battle-hardened truffle whose mycelial roots have grown thick as tree trunks. Fast enough to raid deep behind enemy lines and strong enough to crush whatever it finds there, the Trufflemaker hits harder than anything this mobile has a right to. Each turn its overgrowth spreads groves to all adjacent hexes, claiming territory with every step while its brutal tendrils punish anything that gets close."
    die_sound=hiss-die.ogg

    [standing_anim]
        start_time=0
        [frame]
            image="units/mushrooms/doubletruffle.png"
            halo="halo/elven/nature-halo[1~4].png:200"
        [/frame]
    [/standing_anim]

    [abilities]
        {ABILITY_AMBUSH}
        [dummy]
            id=overgrowth
            name= _ "overgrowth"
            description= _ "This unit spreads Mushroom Groves to all adjacent hexes at the start of each turn, in addition to its own hex."
        [/dummy]
    [/abilities]

    [attack]
        name=tendril_lash
        description= _ "tendril lash"
        icon=attacks/tentacle.png
        type=blade
        range=melee
        damage=10
        number=4
    [/attack]
    [attack]
        name=entangle
        description= _ "entangle"
        icon=attacks/entangle.png
        type=impact
        range=melee
        damage=8
        number=2
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    [/attack]

    {MUSHROOM_DEFEND "units/mushrooms/trufflemaker.png" hiss-hit.wav}
    {MUSHROOM_DEATH "units/mushrooms/trufflemaker.png" hiss-die.ogg}
    {MUSHROOM_ATTACK_MELEE "units/mushrooms/trufflemaker.png" tendril_lash hiss.wav}
    {MUSHROOM_ATTACK_MELEE "units/mushrooms/trufflemaker.png" entangle hiss.wav}
[/unit_type]
