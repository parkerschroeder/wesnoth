#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Trufflemaker
    name= _ "Trufflemaker"
    race=mushroom
    image="units/undead/shadow-s-2.png"
    hitpoints=51
    movement_type=fungalfoot
    movement=6
    experience=150
    level=3
    alignment=chaotic
    advances_to=null
    {AMLA_DEFAULT}
    cost=46
    usage=fighter
    description= _ "The Trufflemaker is nothing but trouble. A master of exploiting weakness, it glides through enemy lines with terrifying grace, striking where venom has already taken hold. Its victims rarely see it coming — and those who do are already too poisoned to fight back."
    die_sound=hiss-die.ogg

    [abilities]
        {ABILITY_SKIRMISHER}
    [/abilities]

    [attack]
        name=toxic_strike
        description= _ "toxic strike"
        icon=attacks/touch-undead.png
        type=blade
        range=melee
        damage=8
        number=3
        [specials]
            {WEAPON_SPECIAL_POISON}
            [damage]
                id=toxic_strike
                name= _ "toxic strike"
                description= _ "This attack deals double damage to poisoned enemies."
                multiply=2
                active_on=offense
                [filter_opponent]
                    [filter_wml]
                        [status]
                            poisoned=yes
                        [/status]
                    [/filter_wml]
                [/filter_opponent]
            [/damage]
        [/specials]
    [/attack]
    [attack]
        name=poison_dart
        description= _ "poison dart"
        icon=attacks/sling.png
        type=pierce
        range=ranged
        damage=5
        number=3
        [specials]
            {WEAPON_SPECIAL_POISON}
        [/specials]
    [/attack]
[/unit_type]
