#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Trufflemaker
    name= _ "Trufflemaker"
    race=mushroom
    image="units/mushrooms/trufflemaker.png"
    hitpoints=52
    movement_type=fungalfoot
    movement=8
    experience=150
    level=3
    alignment=chaotic
    advances_to=null
    {AMLA_DEFAULT}
    cost=46
    usage=scout
    description= _ "The Trufflemaker is the ultimate territorial anchor — a massive, deeply-rooted truffle whose mycelial network has grown so dense that it regenerates damage as fast as it takes it. Each turn its overgrowth spreads groves to all adjacent hexes while its own body knits itself back together, making it nearly impossible to dislodge from a position. Fast enough to raid deep behind enemy lines, tough enough to hold the ground it claims."
    die_sound=hiss-die.ogg

    [standing_anim]
        start_time=0
        [frame]
            image="units/mushrooms/doubletruffle.png"
            halo="halo/elven/nature-halo[1~4].png:200"
        [/frame]
    [/standing_anim]

    [abilities]
        {ABILITY_AMBUSH}
        {ABILITY_REGENERATES}
        [dummy]
            id=overgrowth
            name= _ "overgrowth"
            description= _ "This unit spreads Mushroom Groves to all adjacent hexes at the start of each turn, in addition to its own hex."
        [/dummy]
    [/abilities]

    [attack]
        name=tendril_lash
        description= _ "tendril lash"
        icon=attacks/tentacle.png
        type=blade
        range=melee
        damage=9
        number=4
    [/attack]
    [attack]
        name=entangle
        description= _ "entangle"
        icon=attacks/entangle.png
        type=impact
        range=melee
        damage=7
        number=2
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    [/attack]
[/unit_type]
