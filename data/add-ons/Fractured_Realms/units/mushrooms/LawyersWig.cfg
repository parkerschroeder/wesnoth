#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Lawyers_Wig
    name= _ "Lawyer's Wig"
    race=mushroom
    image="units/mushrooms/lawyerswig.png"
    hitpoints=48
    movement_type=fungalfoot
    movement=5
    experience=150
    level=3
    alignment=neutral
    advances_to=null
    {AMLA_DEFAULT}
    cost=44
    usage=healer
    description= _ "The Lawyer's Wig — named for the powdered wigs once worn by barristers, which the shaggy Coprinus comatus so perfectly resembles — is the supreme healer of the Mycelium. Its regenerative ink dissolves into the air in a fine mist, mending wounds and purging afflictions from every ally nearby. The Lawyer's Wig itself constantly regenerates, its own tissues endlessly dissolving and reforming in a cycle of self-renewal."
    die_sound=hiss-die.ogg

    [abilities]
        {ABILITY_CURES}
        {ABILITY_REGENERATES}
    [/abilities]

    [attack]
        name=tendril
        description= _ "tendril"
        icon=attacks/tentacle.png
        type=impact
        range=melee
        damage=7
        number=3
    [/attack]
    [attack]
        name=spore_puff
        description= _ "spore puff"
        icon=attacks/mudball.png
        type=impact
        range=ranged
        damage=8
        number=2
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    [/attack]

    {MUSHROOM_DEFEND "units/mushrooms/lawyerswig.png" hiss-hit.wav}
    {MUSHROOM_DEATH "units/mushrooms/lawyerswig.png" hiss-die.ogg}
    {MUSHROOM_ATTACK_MELEE "units/mushrooms/lawyerswig.png" tendril staff.ogg}
    {MUSHROOM_ATTACK_RANGED_MAGIC "units/mushrooms/lawyerswig.png" spore_puff staff.ogg}
[/unit_type]
