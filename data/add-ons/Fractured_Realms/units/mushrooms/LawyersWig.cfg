#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Lawyers_Wig
    name= _ "Lawyer's Wig"
    race=mushroom
    image="units/mushrooms/shaggymane.png"
    hitpoints=48
    movement_type=fungalfoot
    movement=5
    experience=150
    level=3
    alignment=neutral
    advances_to=null
    {AMLA_DEFAULT}
    cost=44
    usage=healer
    description= _ "The Lawyer's Wig — named for the powdered wigs once worn by barristers, which the shaggy Coprinus comatus so perfectly resembles — is the supreme healer of the Mycelium. Its regenerative ink dissolves into the air in a fine mist, mending wounds and purging afflictions from every ally nearby. The Lawyer's Wig itself constantly regenerates, its own tissues endlessly dissolving and reforming in a cycle of self-renewal."
    die_sound=hiss-die.ogg

    [abilities]
        {ABILITY_CURES}
        {ABILITY_REGENERATES}
        [heals]
            id=aoe_heal
            value=8
            affect_self=no
            name= _ "heals +8"
            description= _ "Heals adjacent allied units 8 HP per turn and cures poison."
            affect_allies=yes
            poison=cured
            [affect_adjacent]
                adjacent=n,ne,se,s,sw,nw
            [/affect_adjacent]
        [/heals]
    [/abilities]

    [attack]
        name=staff
        description= _ "staff"
        icon=attacks/staff.png
        type=impact
        range=melee
        damage=7
        number=3
    [/attack]
    [attack]
        name=spore_puff
        description= _ "spore puff"
        icon=attacks/mudball.png
        type=impact
        range=ranged
        damage=7
        number=3
    [/attack]
[/unit_type]
