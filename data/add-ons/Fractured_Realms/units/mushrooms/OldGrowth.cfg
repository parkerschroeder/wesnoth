#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Old_Growth
    name= _ "Old Growth"
    race=dwarf
    image="units/dwarves/berserker.png"
    hitpoints=60
    movement_type=dwarvishfoot
    movement=5
    experience=150
    level=3
    alignment=neutral
    advances_to=null
    {AMLA_DEFAULT}
    cost=46
    usage=fighter
    description= _ "The Old Growth is no longer merely a dwarf who eats mushrooms — the boundary between flesh and fungus has blurred beyond recognition. Mycelial threads wind through their veins, roots of pale hyphae crest from beneath scarred skin, and their eyes hold the patient, ageless certainty of something that has been growing in the dark for a very long time. They are the living heart of the grove, and all who fight beside them draw strength from that ancient vitality. Enemies who strike them down find, to their horror, that the grove remembers — and the ground beneath their feet has already begun to change."
    die_sound=dwarf-die.ogg

    [defense]
        fungus=40
        village=60
    [/defense]

    [abilities]
        {ABILITY_LEADERSHIP}
        {ABILITY_REGENERATES}
    [/abilities]

    [attack]
        name=mushroom_frenzy
        description= _ "mushroom frenzy"
        icon=attacks/axe.png
        type=blade
        range=melee
        damage=8
        number=4
        [specials]
            {WEAPON_SPECIAL_BERSERK}
            {WEAPON_SPECIAL_GROVE_BOUND}
        [/specials]
    [/attack]
    [attack]
        name=hand_axe
        description= _ "hand axe"
        icon=attacks/axe.png
        type=blade
        range=melee
        damage=8
        number=4
    [/attack]
    [attack]
        name=spore_toss
        description= _ "spore toss"
        icon=attacks/fungus.png
        type=impact
        range=ranged
        damage=6
        number=3
    [/attack]
[/unit_type]
