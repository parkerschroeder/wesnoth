#textdomain wesnoth-Fractured_Realms

# Spawned by Grove Reanimation event — not recruitable
[unit_type]
    id=Mycelium_Fungal_Zombie
    name= _ "Fungal Zombie"
    race=mushroom
    image="units/undead/soulless-wose.png"
    hitpoints=22
    movement_type=fungalfoot
    movement=4
    experience=30
    level=0
    alignment=chaotic
    advances_to=Mycelium_Sporecap
    cost=8
    usage=fighter
    description= _ "The fallen, consumed by the grove's mycelium and reanimated as a shambling fungal husk. Slow and weak, but another body to spread the grove."
    die_sound=hiss-die.ogg

    [abilities]
        [dummy]
            id=death_bloom
            name= _ "death bloom"
            female_name= _ "female^death bloom"
            description= _ "When this unit dies, all adjacent hexes are converted to Mushroom Grove."
        [/dummy]
    [/abilities]

    [attack]
        name=fungal_fist
        description= _ "fungal fist"
        icon=attacks/fist.png
        type=impact
        range=melee
        damage=4
        number=2
        [specials]
            {WEAPON_SPECIAL_FUNGAL_PLAGUE}
        [/specials]
    [/attack]
[/unit_type]
