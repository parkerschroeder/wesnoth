#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Cosmic_Shroom
    name= _ "Cosmic Shroom"
    race=mushroom
    image="units/mushrooms/cosmicshroom.png"
    hitpoints=44
    movement_type=fungalfoot
    movement=5
    experience=150
    level=3
    alignment=chaotic
    advances_to=null
    {AMLA_DEFAULT}
    cost=50
    usage=archer
    description= _ "The Cosmic Shroom has transcended the boundaries of mortal fungi. Where the Black Hole absorbed light, the Cosmic Shroom has collapsed inward entirely — a walking singularity of pure arcane force. Its void blasts shred through any defense, ignoring armor entirely. Reality bends around this alien horror, darkness pooling in its wake as it devours everything in its path."
    die_sound=hiss-die.ogg

    [abilities]
        {ABILITY_OBSCURE}
        {ABILITY_FEEDING}
    [/abilities]

    [attack]
        name=void_touch
        description= _ "void touch"
        icon=attacks/touch-undead.png
        type=arcane_focus
        range=melee
        damage=7
        number=3
    [/attack]
    [attack]
        name=void_bolt
        description= _ "void bolt"
        icon=attacks/dark-missile.png
        type=arcane_focus
        range=ranged
        damage=12
        number=3
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
    [/attack]

    {MUSHROOM_DEFEND_BLINK "units/mushrooms/cosmicshroom.png" hiss-hit.wav}
    {MUSHROOM_DEATH "units/mushrooms/cosmicshroom.png" hiss-die.ogg}
    {MUSHROOM_ATTACK_MELEE "units/mushrooms/cosmicshroom.png" void_touch hiss.wav}
    {MUSHROOM_ATTACK_RANGED_MAGIC "units/mushrooms/cosmicshroom.png" void_bolt magicmissile.wav}
[/unit_type]
