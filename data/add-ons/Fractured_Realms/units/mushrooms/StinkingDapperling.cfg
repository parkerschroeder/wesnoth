#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Stinking_Dapperling
    name= _ "Stinking Dapperling"
    race=mushroom
    image="units/mushrooms/stinkingdapperling.png"
    hitpoints=36
    movement_type=fungalfoot
    movement=5
    experience=100
    level=2
    alignment=chaotic
    advances_to=Mycelium_Deadly_Dapperling
    cost=32
    usage=archer
    description= _ "A ghostly pale fungus that emerges only in darkness, the Stinking Dapperling is among the most lethal of the Mycelium. Its toxins have intensified beyond the Deathcap's already deadly potency — and when it channels the mycelial network beneath a mushroom grove, it releases a billowing poison cloud that chokes all enemies near its target."
    die_sound=hiss-die.ogg

    [attack]
        name=toxic_touch
        description= _ "toxic touch"
        icon=attacks/touch-undead.png
        type=blade
        range=melee
        damage=6
        number=2
        [specials]
            {WEAPON_SPECIAL_POISON}
        [/specials]
    [/attack]
    [attack]
        name=poison_dart
        description= _ "poison dart"
        icon=attacks/sling.png
        type=pierce
        range=ranged
        damage=7
        number=2
        [specials]
            {WEAPON_SPECIAL_POISON}
        [/specials]
    [/attack]
    [attack]
        name=poison_cloud
        description= _ "poison cloud"
        icon=attacks/mudball.png
        type=impact
        range=ranged
        damage=5
        number=3
        [specials]
            {WEAPON_SPECIAL_POISON}
            {WEAPON_SPECIAL_AOE poison_cloud "poison cloud" "When this attack hits, all enemies adjacent to the target take 50% splash damage and are poisoned."}
            {WEAPON_SPECIAL_GROVE_BOUND}
        [/specials]
    [/attack]

    {MUSHROOM_DEFEND "units/mushrooms/stinkingdapperling.png" hiss-hit.wav}
    {MUSHROOM_DEATH "units/mushrooms/stinkingdapperling.png" hiss-die.ogg}
    {MUSHROOM_ATTACK_MELEE "units/mushrooms/stinkingdapperling.png" toxic_touch hiss.wav}
    {MUSHROOM_ATTACK_RANGED_MAGIC "units/mushrooms/stinkingdapperling.png" poison_dart poison.ogg}
    {MUSHROOM_ATTACK_RANGED_MAGIC "units/mushrooms/stinkingdapperling.png" poison_cloud poison.ogg}
[/unit_type]
