#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_King_Oyster
    name= _ "King Oyster"
    race=mushroom
    image="units/mushrooms/kingoyster.png"
    hitpoints=62
    movement_type=fungalfoot
    movement=4
    experience=144
    level=3
    alignment=neutral
    advances_to=null
    cost=63
    usage=fighter
    description= _ "The largest and most substantial of the oyster line, the King Oyster has grown a trunk-like stem of incredible density — thick, pale, and meaty as the real Pleurotus eryngii it takes its name from. Where lesser oysters cling to surfaces, the King Oyster stands alone, rooted and immovable. Its layered cap turns aside blades and arrows while its massive club shatters shields. Few things in nature are harder to move."
    die_sound=hiss-die.ogg

    [resistance]
        blade=70
        pierce=70
        impact=80
        fire=90
        arcane=90
    [/resistance]

    [defense]
        fungus=40
    [/defense]

    [abilities]
        {ABILITY_STEADFAST}
    [/abilities]

    [attack]
        name=club
        description= _ "club"
        icon=attacks/club-small.png
        type=impact
        range=melee
        damage=10
        number=3
    [/attack]
    [attack]
        name=spore_puff
        description= _ "spore puff"
        icon=attacks/mud-glob.png
        type=impact
        range=ranged
        damage=12
        number=1
    [/attack]

    {MUSHROOM_DEFEND "units/mushrooms/kingoyster.png" hiss-hit.wav}
    {MUSHROOM_DEATH_SINK "units/mushrooms/kingoyster.png" hiss-die.ogg}
    {MUSHROOM_ATTACK_MELEE "units/mushrooms/kingoyster.png" club club.ogg}
    {MUSHROOM_ATTACK_RANGED_MAGIC "units/mushrooms/kingoyster.png" spore_puff staff.ogg}
[/unit_type]
