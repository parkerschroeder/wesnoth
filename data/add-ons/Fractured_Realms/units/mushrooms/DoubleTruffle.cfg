#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Double_Truffle
    name= _ "Double Truffle"
    race=mushroom
    image="units/undead/shadow-s-2.png"
    hitpoints=40
    movement_type=fungalfoot
    movement=6
    experience=48
    level=2
    alignment=chaotic
    advances_to=Mycelium_Trufflemaker
    cost=30
    usage=fighter
    description= _ "A dark, knobbly truffle that has evolved to exploit weakness. Hidden underground like its namesake, the Double Truffle senses the toxins coursing through a victim's body and strikes where the venom has already done its work — dealing double damage to the already-poisoned."
    die_sound=hiss-die.ogg

    [attack]
        name=toxic_strike
        description= _ "toxic strike"
        icon=attacks/touch-undead.png
        type=blade
        range=melee
        damage=6
        number=3
        [specials]
            {WEAPON_SPECIAL_POISON}
            [damage]
                id=toxic_strike
                name= _ "toxic strike"
                description= _ "This attack deals double damage to poisoned enemies."
                multiply=2
                active_on=offense
                [filter_opponent]
                    [filter_wml]
                        [status]
                            poisoned=yes
                        [/status]
                    [/filter_wml]
                [/filter_opponent]
            [/damage]
        [/specials]
    [/attack]
    [attack]
        name=poison_dart
        description= _ "poison dart"
        icon=attacks/sling.png
        type=pierce
        range=ranged
        damage=4
        number=2
        [specials]
            {WEAPON_SPECIAL_POISON}
        [/specials]
    [/attack]
[/unit_type]
