#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Double_Truffle
    name= _ "Double Truffle"
    race=mushroom
    image="units/mushrooms/doubletruffle.png"
    hitpoints=38
    movement_type=fungalfoot
    movement=8
    experience=55
    level=2
    alignment=chaotic
    advances_to=Mycelium_Trufflemaker
    cost=30
    usage=scout
    description= _ "The Double Truffle has sunk deep roots into the mycelial network, extending its influence beyond itself. Each turn, it spreads Mushroom Groves to all adjacent hexes — not just the hex it stands on. Combined with its speed and ambush, the Double Truffle is the faction's premier territory raider: it dashes deep into enemy lines and leaves a trail of fungal growth in its wake."
    die_sound=hiss-die.ogg

    [standing_anim]
        start_time=0
        [frame]
            image="units/mushrooms/doubletruffle.png"
        [/frame]
    [/standing_anim]

    [abilities]
        {ABILITY_AMBUSH}
        [dummy]
            id=overgrowth
            name= _ "overgrowth"
            description= _ "This unit spreads Mushroom Groves to all adjacent hexes at the start of each turn, in addition to its own hex."
        [/dummy]
    [/abilities]

    [attack]
        name=tendril_lash
        description= _ "tendril lash"
        icon=attacks/tentacle.png
        type=blade
        range=melee
        damage=7
        number=4
    [/attack]
    [attack]
        name=entangle
        description= _ "entangle"
        icon=attacks/entangle.png
        type=impact
        range=melee
        damage=5
        number=2
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    [/attack]

    {MUSHROOM_DEFEND "units/mushrooms/doubletruffle.png" hiss-hit.wav}
    {MUSHROOM_DEATH "units/mushrooms/doubletruffle.png" hiss-die.ogg}
    {MUSHROOM_ATTACK_MELEE "units/mushrooms/doubletruffle.png" tendril_lash hiss.wav}
    {MUSHROOM_ATTACK_MELEE "units/mushrooms/doubletruffle.png" entangle hiss.wav}
[/unit_type]
