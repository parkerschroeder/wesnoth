#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Broodcap
    name= _ "Broodcap"
    race=mushroom
    image="units/undead/zombie-wose.png"
    hitpoints=40
    movement_type=fungalfoot
    movement=5
    experience=100
    level=2
    alignment=chaotic
    advances_to=null
    cost=34
    usage=fighter
    description= _ "The fully matured Cordyceps becomes a Broodcap — a bloated, pulsing fungal horror that launches volleys of mind-controlling spores. Its domination spores strike with arcane precision, ignoring terrain and converting the slain into obedient fungal servants."
    die_sound=hiss-die.ogg

    [attack]
        name=parasitic_touch
        description= _ "parasitic touch"
        icon=attacks/touch-undead.png
        type=blade
        range=melee
        damage=6
        number=3
        [specials]
            {WEAPON_SPECIAL_DRAIN}
        [/specials]
    [/attack]
    [attack]
        name=domination_spore
        description= _ "domination spore"
        icon=attacks/mudball.png
        type=arcane
        range=ranged
        damage=5
        number=4
        [specials]
            {WEAPON_SPECIAL_FUNGAL_PLAGUE}
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
    [/attack]
[/unit_type]
