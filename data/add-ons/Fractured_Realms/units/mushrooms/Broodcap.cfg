#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Broodcap
    name= _ "Broodcap"
    race=mushroom
    image="units/undead/zombie-wose.png"
    hitpoints=45
    movement_type=fungalfoot
    movement=5
    experience=75
    level=2
    alignment=chaotic
    advances_to=Mycelium_Sporarch
    cost=34
    usage=mixed fighter
    description= _ "The fully matured Cordyceps becomes a Broodcap — a bloated, pulsing fungal horror that infects the battlefield with its spores. Its mere presence causes nearby allies' attacks to spawn Fungal Spores from slain enemies, turning every kill into reinforcements."
    die_sound=hiss-die.ogg

    [abilities]
        [plague]
            id=fungal_brood
            name= _ "fungal brood"
            description= _ "Adjacent allied units' attacks spawn Fungal Spores from slain enemies."
            type=Mycelium_Fungal_Spore
            affect_self=no
            affect_allies=yes
            [affect_adjacent]
            [/affect_adjacent]
        [/plague]
    [/abilities]

    [attack]
        name=parasitic_touch
        description= _ "parasitic touch"
        icon=attacks/touch-undead.png
        type=blade
        range=melee
        damage=6
        number=3
        [specials]
            {WEAPON_SPECIAL_DRAIN}
        [/specials]
    [/attack]
    [attack]
        name=domination_spore
        description= _ "domination spore"
        icon=attacks/mudball.png
        type=arcane
        range=ranged
        damage=5
        number=4
        [specials]
            {WEAPON_SPECIAL_FUNGAL_PLAGUE}
        [/specials]
    [/attack]
[/unit_type]
