#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Puffball
    name= _ "Puffball"
    race=mushroom
    image="units/elves-deep/wisp.png"
    hitpoints=22
    movement_type=fungalfoot
    movement=6
    experience=32
    level=1
    alignment=chaotic
    advances_to=null
    cost=14
    usage=fighter
    description= _ "A round, bouncy mushroom that bursts with spores when struck down. Small and cheap, the Puffball slips through enemy lines to spread plague and detonate in a bloom of fungal growth."
    die_sound=hiss-die.ogg

    [abilities]
        {ABILITY_SKIRMISHER}
        [dummy]
            id=death_bloom
            name= _ "death bloom"
            female_name= _ "female^death bloom"
            description= _ "When this unit dies, nearby hexes are converted to Mushroom Grove and adjacent enemies are poisoned."
        [/dummy]
    [/abilities]

    [attack]
        name=bump
        description= _ "bump"
        icon=attacks/fist.png
        type=impact
        range=melee
        damage=3
        number=3
        [specials]
            {WEAPON_SPECIAL_FUNGAL_PLAGUE}
        [/specials]
    [/attack]
[/unit_type]
