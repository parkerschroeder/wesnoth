#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Puffball
    name= _ "Puffball"
    race=mushroom
    image="units/elves-deep/wisp.png"
    hitpoints=22
    movement_type=fungalfoot
    flies=yes
    movement=6
    experience=32
    level=1
    alignment=chaotic
    [movement_costs]
        shallow_water=1
        reef=1
        swamp_water=1
        sand=1
        hills=1
        mountains=1
        frozen=1
    [/movement_costs]
    [defense]
        shallow_water=50
        reef=50
        swamp_water=50
        flat=50
        sand=50
        forest=50
        hills=50
        mountains=50
        village=50
        castle=50
        cave=50
        frozen=50
        fungus=40
    [/defense]
    advances_to=null
    cost=11
    usage=fighter
    description= _ "A buoyant spore-filled mushroom that drifts across the battlefield on the wind. It floats over any obstacle, slipping through enemy lines to spread plague and detonate in a bloom of fungal growth."
    die_sound=hiss-die.ogg

    [abilities]
        {ABILITY_SKIRMISHER}
        [dummy]
            id=death_bloom
            name= _ "death bloom"
            female_name= _ "female^death bloom"
            description= _ "When this unit dies, nearby hexes are converted to Mushroom Grove and adjacent enemies are poisoned."
        [/dummy]
    [/abilities]

    [attack]
        name=bump
        description= _ "bump"
        icon=attacks/fist.png
        type=impact
        range=melee
        damage=3
        number=3
        [specials]
            {WEAPON_SPECIAL_FUNGAL_PLAGUE}
        [/specials]
    [/attack]
[/unit_type]
