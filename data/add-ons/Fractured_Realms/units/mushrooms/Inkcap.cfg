#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Inkcap
    name= _ "Inkcap"
    race=mushroom
    image="units/mushrooms/inkcap.png"
    hitpoints=40
    movement_type=fungalfoot
    movement=6
    experience=48
    level=2
    alignment=chaotic
    advances_to=Mycelium_Nightcap
    cost=30
    usage=archer
    description= _ "Like the real Coprinopsis atramentaria — the common inkcap that reacts violently with alcohol in the bloodstream — this fungus has evolved to exploit what's already inside its victims. Its catalyst spores react with toxins already coursing through a poisoned body, triggering a devastating chain reaction that doubles the damage dealt. Where the Deathcap poisons, the Inkcap finishes the job from afar."
    die_sound=hiss-die.ogg

    [attack]
        name=toxic_touch
        description= _ "toxic touch"
        icon=attacks/touch-undead.png
        type=blade
        range=melee
        damage=4
        number=2
        [specials]
            {WEAPON_SPECIAL_POISON}
        [/specials]
    [/attack]
    [attack]
        name=catalyst_spore
        description= _ "catalyst spore"
        icon=attacks/sling.png
        type=pierce
        range=ranged
        damage=6
        number=3
        [specials]
            [damage]
                id=toxic_strike
                name= _ "toxic strike"
                description= _ "This attack accelerates the poison already in a victim's body, dealing double damage to poisoned enemies."
                multiply=2
                active_on=offense
                [filter_opponent]
                    [filter_wml]
                        [status]
                            poisoned=yes
                        [/status]
                    [/filter_wml]
                [/filter_opponent]
            [/damage]
        [/specials]
    [/attack]
[/unit_type]
