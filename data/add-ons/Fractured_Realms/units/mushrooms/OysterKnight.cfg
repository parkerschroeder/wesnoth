#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Oyster_Knight
    name= _ "Oyster Knight"
    race=mushroom
    image="units/mushrooms/oysterknight.png"
    hitpoints=59
    movement_type=fungalfoot
    movement=4
    experience=100
    level=2
    alignment=neutral
    advances_to=Mycelium_King_Oyster
    cost=32
    usage=fighter
    description= _ "Like the shelf fungi it resembles, the Oyster Knight grows in dense, overlapping layers — each one harder than the last. Its pale, fan-shaped cap shrugs off blows that would fell lesser creatures, and like the real oyster mushroom that traps and devours nematodes, the Oyster Knight is deceptively predatory beneath its stolid exterior. It simply stands its ground, absorbing punishment with steadfast resolve while its heavy club batters anyone foolish enough to close."
    die_sound=hiss-die.ogg

    [resistances]
        blade=70
        pierce=70
        impact=80
        fire=100
        arcane=100
    [/resistances]

    [abilities]
        {ABILITY_STEADFAST}
    [/abilities]

    [attack]
        name=club
        description= _ "club"
        icon=attacks/club-small.png
        type=impact
        range=melee
        damage=8
        number=3
    [/attack]
    [attack]
        name=spore_puff
        description= _ "spore puff"
        icon=attacks/mudball.png
        type=impact
        range=ranged
        damage=9
        number=1
    [/attack]
[/unit_type]
