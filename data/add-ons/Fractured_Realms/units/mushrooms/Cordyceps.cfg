#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Cordyceps
    name= _ "Cordyceps"
    race=mushroom
    image="units/undead/zombie-wose.png"
    hitpoints=25
    movement_type=fungalfoot
    movement=5
    experience=36
    level=1
    alignment=chaotic
    advances_to=Mycelium_Broodcap
    cost=16
    usage=fighter
    description= _ "A parasitic fungus that feeds on its victims' life force. The Cordyceps drains health in melee to sustain itself despite its frail form, while its mind spores slow enemies at range."
    die_sound=hiss-die.ogg

    [attack]
        name=parasitic_touch
        description= _ "parasitic touch"
        icon=attacks/touch-undead.png
        type=blade
        range=melee
        damage=4
        number=3
        [specials]
            {WEAPON_SPECIAL_DRAIN}
        [/specials]
    [/attack]
    [attack]
        name=mind_spore
        description= _ "mind spore"
        icon=attacks/mudball.png
        type=arcane
        range=ranged
        damage=3
        number=3
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    [/attack]
[/unit_type]
