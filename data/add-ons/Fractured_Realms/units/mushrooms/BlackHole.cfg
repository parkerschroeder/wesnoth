#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Black_Hole
    name= _ "Black Hole"
    race=mushroom
    image="units/mushrooms/blackhole.png"
    hitpoints=36
    movement_type=fungalfoot
    movement=5
    experience=100
    level=2
    alignment=chaotic
    advances_to=Mycelium_Cosmic_Shroom
    cost=34
    usage=archer
    description= _ "Where the Glowcap radiates light, the Black Hole devours it. Its bioluminescence has inverted — the cap absorbs all surrounding energy into a dark singularity of concentrated arcane force. A living gravitational anomaly that darkens the battlefield around it, growing stronger with every enemy it consumes."
    die_sound=hiss-die.ogg

    [abilities]
        {ABILITY_OBSCURE}
        {ABILITY_FEEDING}
    [/abilities]

    [attack]
        name=void_touch
        description= _ "void touch"
        icon=attacks/touch-undead.png
        type=arcane_focus
        range=melee
        damage=5
        number=2
    [/attack]
    [attack]
        name=void_bolt
        description= _ "void bolt"
        icon=attacks/dark-missile.png
        type=arcane_focus
        range=ranged
        damage=9
        number=3
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
    [/attack]

    {MUSHROOM_DEFEND_BLINK "units/mushrooms/blackhole.png" hiss-hit.wav}
    {MUSHROOM_DEATH "units/mushrooms/blackhole.png" hiss-die.ogg}
    {MUSHROOM_ATTACK_MELEE "units/mushrooms/blackhole.png" void_touch hiss.wav}
    {MUSHROOM_ATTACK_RANGED_MAGIC "units/mushrooms/blackhole.png" void_bolt magicmissile.wav}
[/unit_type]
