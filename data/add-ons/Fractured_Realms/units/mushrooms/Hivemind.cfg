#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Hivemind
    name= _ "Hivemind"
    race=mushroom
    image="units/undead/zombie-wose.png"
    hitpoints=55
    movement_type=fungalfoot
    movement=5
    experience=150
    level=3
    alignment=chaotic
    advances_to=null
    {AMLA_DEFAULT}
    cost=50
    usage=fighter
    description= _ "The Hivemind is the apex of the Cordyceps line — a towering fungal intelligence that has woven its mycelial network so deeply into the earth that it can command the very life force of the battlefield. Its parasitic threads grant adjacent allies the power to drain their enemies, while its commanding presence inspires them to fight harder. Where the Hivemind stands, the mycelium fights as one."
    die_sound=hiss-die.ogg

    [abilities]
        {ABILITY_LEADERSHIP}
        [drains]
            id=parasitic_link
            name= _ "parasitic link"
            description= _ "Adjacent allied units drain health from their attacks, healing themselves for half the damage dealt."
            value=50
            affect_self=no
            affect_allies=yes
            [affect_adjacent]
            [/affect_adjacent]
        [/drains]
    [/abilities]

    [attack]
        name=parasitic_touch
        description= _ "parasitic touch"
        icon=attacks/touch-undead.png
        type=blade
        range=melee
        damage=7
        number=3
        [specials]
            {WEAPON_SPECIAL_DRAIN}
        [/specials]
    [/attack]
    [attack]
        name=mind_spore
        description= _ "mind spore"
        icon=attacks/mudball.png
        type=arcane
        range=ranged
        damage=7
        number=3
    [/attack]
[/unit_type]
