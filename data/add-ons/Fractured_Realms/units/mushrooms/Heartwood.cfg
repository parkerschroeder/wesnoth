#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Heartwood
    name= _ "Heartwood"
    race=mushroom
    image="units/monsters/giant-mudcrawler.png"
    hitpoints=68
    movement_type=fungalfoot
    movement=4
    experience=150
    level=3
    alignment=neutral
    advances_to=null
    cost=63
    usage=fighter
    description= _ "A Chaga that has fully fused with the dead heartwood of its host tree, becoming something harder than either fungus or timber alone. The Heartwood is an immovable bulwark — its charcoal-black shell turns aside blades and arrows while its massive club shatters shields. Few things in nature are harder to move."
    die_sound=hiss-die.ogg

    [resistances]
        blade=70
        pierce=70
        impact=80
        fire=90
        arcane=90
    [/resistances]

    [abilities]
        {ABILITY_STEADFAST}
    [/abilities]

    [attack]
        name=club
        description= _ "club"
        icon=attacks/club-small.png
        type=impact
        range=melee
        damage=10
        number=3
    [/attack]
    [attack]
        name=spore_puff
        description= _ "spore puff"
        icon=attacks/mudball.png
        type=impact
        range=ranged
        damage=12
        number=1
    [/attack]
[/unit_type]
