#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Milky_Way
    name= _ "Milky Way"
    race=mushroom
    image="units/mushrooms/earthstar.png"
    hitpoints=48
    movement_type=fungalfoot
    movement=5
    experience=150
    level=3
    alignment=neutral
    advances_to=null
    {AMLA_DEFAULT}
    cost=50
    usage=archer
    description= _ "Named for Mycena galactopea — the milky-capped bonnet that weeps pale latex when cut — the Milky Way is the ultimate expression of the Glowcap line's bioelectric mastery. Its star-burst rays have grown enormous, channels so refined that each discharge arcs hotter and farther than any Earth Star could manage. When it draws on the grove, the resulting lightning storm is devastating — a white-hot cascade of bolts that leaps from enemy to enemy in a blinding, star-shaped detonation."
    die_sound=hiss-die.ogg

    [attack]
        name=shock_touch
        description= _ "shock touch"
        icon=attacks/lightning.png
        type=electric
        range=melee
        damage=7
        number=3
    [/attack]
    [attack]
        name=spark_bolt
        description= _ "spark bolt"
        icon=attacks/lightning.png
        type=electric
        range=ranged
        damage=12
        number=3
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
    [/attack]
    [attack]
        name=lightning_storm
        description= _ "lightning storm"
        icon=attacks/lightning.png
        type=electric
        range=ranged
        damage=14
        number=3
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
            {WEAPON_SPECIAL_AOE lightning_storm "lightning storm" "When this attack hits, all enemies adjacent to the target take 70% splash electric damage."}
            {WEAPON_SPECIAL_GROVE_BOUND}
        [/specials]
    [/attack]
[/unit_type]
