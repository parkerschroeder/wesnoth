#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Nightcap
    name= _ "Nightcap"
    race=mushroom
    image="units/human-legion/arbalestier.png"
    hitpoints=51
    movement_type=fungalfoot
    movement=6
    experience=150
    level=3
    alignment=chaotic
    advances_to=null
    {AMLA_DEFAULT}
    cost=46
    usage=archer
    description= _ "The Trufflemaker is nothing but trouble. A peerless marksman, its catalyst spores never miss their mark — and against a poisoned target, the results are devastating. No amount of cover can save a victim once the Trufflemaker has them in its sights."
    die_sound=hiss-die.ogg

    [abilities]
    [/abilities]

    [attack]
        name=toxic_touch
        description= _ "toxic touch"
        icon=attacks/touch-undead.png
        type=blade
        range=melee
        damage=5
        number=3
        [specials]
            {WEAPON_SPECIAL_POISON}
        [/specials]
    [/attack]
    [attack]
        name=catalyst_spore
        description= _ "catalyst spore"
        icon=attacks/sling.png
        type=pierce
        range=ranged
        damage=8
        number=3
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
            [damage]
                id=toxic_strike
                name= _ "toxic strike"
                description= _ "This attack accelerates the poison already in a victim's body, dealing double damage to poisoned enemies."
                multiply=2
                active_on=offense
                [filter_opponent]
                    [filter_wml]
                        [status]
                            poisoned=yes
                        [/status]
                    [/filter_wml]
                [/filter_opponent]
            [/damage]
        [/specials]
    [/attack]
[/unit_type]
