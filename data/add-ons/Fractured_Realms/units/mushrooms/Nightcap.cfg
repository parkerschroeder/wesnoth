#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Nightcap
    name= _ "Nightcap"
    race=mushroom
    image="units/mushrooms/nightcap.png"
    hitpoints=51
    movement_type=fungalfoot
    movement=6
    experience=150
    level=3
    alignment=chaotic
    advances_to=null
    {AMLA_DEFAULT}
    cost=46
    usage=archer
    description= _ "Small, brown, and easily overlooked — just like the real Galerina marginata, the deadly 'funeral bell' that kills more foragers than any other mushroom. The Nightcap is a peerless marksman whose catalyst spores never miss their mark, and against a poisoned target, the results are devastating. It carries the same amatoxins as the Deathcap in a body a fraction of the size. No amount of cover can save a victim once the Nightcap has them in its sights."
    die_sound=hiss-die.ogg

    [abilities]
    [/abilities]

    [attack]
        name=toxic_touch
        description= _ "toxic touch"
        icon=attacks/touch-undead.png
        type=blade
        range=melee
        damage=5
        number=3
        [specials]
            {WEAPON_SPECIAL_POISON}
        [/specials]
    [/attack]
    [attack]
        name=catalyst_spore
        description= _ "catalyst spore"
        icon=attacks/sling.png
        type=pierce
        range=ranged
        damage=8
        number=3
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
            [damage]
                id=toxic_strike
                name= _ "toxic strike"
                description= _ "This attack accelerates the poison already in a victim's body, dealing double damage to poisoned enemies."
                multiply=2
                active_on=offense
                [filter_opponent]
                    [filter_wml]
                        [status]
                            poisoned=yes
                        [/status]
                    [/filter_wml]
                [/filter_opponent]
            [/damage]
        [/specials]
    [/attack]

    {MUSHROOM_DEFEND "units/mushrooms/nightcap.png" hiss-hit.wav}
    {MUSHROOM_DEATH "units/mushrooms/nightcap.png" hiss-die.ogg}
    {MUSHROOM_ATTACK_MELEE "units/mushrooms/nightcap.png" toxic_touch hiss.wav}
    {MUSHROOM_ATTACK_RANGED_MAGIC "units/mushrooms/nightcap.png" catalyst_spore magicmissile.wav}
[/unit_type]
