#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Deathcap
    name= _ "Deathcap"
    race=mushroom
    image="units/mushrooms/deathcap.png"
    hitpoints=24
    movement_type=fungalfoot
    movement=5
    experience=24
    level=1
    alignment=chaotic
    advances_to=Mycelium_Stinking_Dapperling,Mycelium_Inkcap
    cost=15
    usage=archer
    description= _ "A deadly Amanita that launches toxic spores from a distance. Fragile but devastatingly poisonous, the Deathcap peppers enemies with venomous barbs, letting its toxins do the real killing."
    die_sound=hiss-die.ogg

    [attack]
        name=toxic_touch
        description= _ "toxic touch"
        icon=attacks/touch-undead.png
        type=blade
        range=melee
        damage=3
        number=2
        [specials]
            {WEAPON_SPECIAL_POISON}
        [/specials]
    [/attack]
    [attack]
        name=poison_dart
        description= _ "poison dart"
        icon=attacks/sling.png
        type=pierce
        range=ranged
        damage=5
        number=3
        [specials]
            {WEAPON_SPECIAL_POISON}
        [/specials]
    [/attack]
[/unit_type]
