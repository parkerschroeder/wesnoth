#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Fairy_Ring
    name= _ "Fairy Ring"
    race=mushroom
    image="units/mushrooms/fairyring.png"
    hitpoints=54
    movement_type=fungalfoot
    movement=8
    experience=150
    level=3
    alignment=chaotic
    advances_to=null
    {AMLA_DEFAULT}
    cost=46
    usage=scout
    description= _ "The Fairy Ring is the ultimate expression of the mycelial network — a vast, ancient intelligence whose threads run so deep and wide that the boundaries between groves cease to matter. Where the Portalbello can only move itself through the network, the Fairy Ring extends this power to all nearby allies. Units standing adjacent to the Fairy Ring can dissolve into the underground network and reform at any distant grove in an instant. It is the loom upon which the faction's strategy is woven."
    die_sound=hiss-die.ogg

    [abilities]
        [dummy]
            id=disengage
            name= _ "disengage"
            description= _ "After attacking, this unit retains 1 movement point, allowing it to retreat or reposition."
        [/dummy]
        [teleport]
            id=mycelial_network
            name= _ "mycelial network"
            description= _ "This unit and adjacent allies can teleport between any mushroom grove or mushroom forest tiles."
            affect_self=yes
            affect_allies=yes
            [affect_adjacent]
            [/affect_adjacent]
            [tunnel]
                id=mycelial_tunnel
                [source]
                    terrain=*^Tf,*^Tff
                [/source]
                [target]
                    terrain=*^Tf,*^Tff
                [/target]
                [filter]
                [/filter]
            [/tunnel]
        [/teleport]
    [/abilities]

    [attack]
        name=tendril_lash
        description= _ "tendril lash"
        icon=attacks/tentacle.png
        type=blade
        range=melee
        damage=9
        number=4
    [/attack]
    [attack]
        name=entangle
        description= _ "entangle"
        icon=attacks/entangle.png
        type=impact
        range=melee
        damage=7
        number=2
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    [/attack]
[/unit_type]
