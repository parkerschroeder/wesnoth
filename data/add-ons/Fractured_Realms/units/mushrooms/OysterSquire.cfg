#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Oyster_Squire
    name= _ "Oyster Squire"
    race=mushroom
    image="units/mushrooms/oystersquire.png"
    hitpoints=32
    movement_type=fungalfoot
    movement=4
    experience=34
    level=1
    alignment=chaotic
    advances_to=Mycelium_Oyster_Vizier,Mycelium_Oyster_Knight
    cost=15
    usage=fighter
    description= _ "A stout toadstool warrior that anchors the Mycelium battle line. Its heavy club slows enemies on impact while its spore puffs harass at range."
    die_sound=hiss-die.ogg

    [resistances]
        fire=100
        arcane=100
    [/resistances]

    [defense]
        fungus=40
    [/defense]

    [attack]
        name=club
        description= _ "club"
        icon=attacks/club-small.png
        type=impact
        range=melee
        damage=6
        number=2
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    [/attack]
    [attack]
        name=spore_puff
        description= _ "spore puff"
        icon=attacks/mudball.png
        type=impact
        range=ranged
        damage=3
        number=2
    [/attack]

    {MUSHROOM_DEFEND "units/mushrooms/oystersquire.png" hiss-hit.wav}
    {MUSHROOM_DEATH_SINK "units/mushrooms/oystersquire.png" hiss-die.ogg}
    {MUSHROOM_ATTACK_MELEE "units/mushrooms/oystersquire.png" club club.ogg}
    {MUSHROOM_ATTACK_RANGED_MAGIC "units/mushrooms/oystersquire.png" spore_puff staff.ogg}
[/unit_type]
