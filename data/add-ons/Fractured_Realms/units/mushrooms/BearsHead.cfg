#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Bears_Head
    name= _ "Bear's Head"
    race=mushroom
    image="units/mushrooms/bearshead.png"
    hitpoints=32
    movement_type=fungalfoot
    movement=5
    experience=100
    level=2
    alignment=chaotic
    advances_to=Mycelium_Bleeding_Tooth
    cost=30
    usage=fighter
    description= _ "A close cousin of the Lion's Mane, the Bear's Head shares the same cascading, tooth-like spines — but where the Lion's Mane uses them to heal, the Bear's Head has weaponized them. Each dangling spine drips with blight, choking the life force of enemies and rendering them unable to heal. When it channels the mycelial network beneath a mushroom grove, it releases a devastating wave of blighting spores that spread the corruption to all nearby foes."
    die_sound=hiss-die.ogg

    [attack]
        name=tendril
        description= _ "tendril"
        icon=attacks/tentacle.png
        type=impact
        range=melee
        damage=5
        number=3
    [/attack]
    [attack]
        name=blight_spore
        description= _ "blight spore"
        icon=attacks/mud-glob.png
        type=impact
        range=ranged
        damage=6
        number=3
        [specials]
            {WEAPON_SPECIAL_BLIGHT}
        [/specials]
    [/attack]
    [attack]
        name=blighting_spores
        description= _ "blighting spores"
        icon=attacks/squall.png
        type=impact
        range=ranged
        damage=6
        number=3
        [specials]
            {WEAPON_SPECIAL_AOE blight "blighting spores" "When this attack hits, all enemies adjacent to the target take 50% splash damage and become unhealable until their next turn. Unhealable units cannot be healed by healers, villages, or resting."}
            {WEAPON_SPECIAL_GROVE_BOUND}
        [/specials]
    [/attack]

    {MUSHROOM_DEFEND "units/mushrooms/bearshead.png" hiss-hit.wav}
    {MUSHROOM_DEATH "units/mushrooms/bearshead.png" hiss-die.ogg}
    {MUSHROOM_ATTACK_MELEE "units/mushrooms/bearshead.png" tendril staff.ogg}
    {MUSHROOM_ATTACK_RANGED_MAGIC "units/mushrooms/bearshead.png" blight_spore staff.ogg}
    {MUSHROOM_ATTACK_RANGED_MAGIC "units/mushrooms/bearshead.png" blighting_spores staff.ogg}
[/unit_type]
