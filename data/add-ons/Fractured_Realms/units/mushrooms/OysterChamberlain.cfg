#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Oyster_Chamberlain
    name= _ "Oyster Chamberlain"
    race=mushroom
    image="units/mushrooms/oystervizier.png"
    hitpoints=62
    movement_type=fungalfoot
    movement=4
    experience=150
    level=3
    alignment=chaotic
    advances_to=null
    {AMLA_DEFAULT}
    cost=52
    usage=fighter
    description= _ "The Oyster Chamberlain has grown so massive that its layered, shelf-like plates can unleash devastating eruptions of numbing spores — far more potent than a Vizier's. Like all oyster-line eruptions, the blast draws power from the mycelial grove beneath its feet, consuming the fungal terrain in the process. But the sheer volume of spores packed under those enormous fans makes the devastation worth the cost."
    die_sound=hiss-die.ogg

    [resistances]
        fire=100
        arcane=100
    [/resistances]

    [defense]
        fungus=40
    [/defense]

    [attack]
        name=club
        description= _ "club"
        icon=attacks/club-small.png
        type=impact
        range=melee
        damage=11
        number=3
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    [/attack]
    [attack]
        name=spore_puff
        description= _ "spore puff"
        icon=attacks/mudball.png
        type=impact
        range=ranged
        damage=8
        number=2
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    [/attack]
    [attack]
        name=spore_eruption
        description= _ "spore eruption"
        icon=attacks/mudball.png
        type=impact
        range=ranged
        damage=12
        number=2
        [specials]
            {WEAPON_SPECIAL_SLOW}
            {WEAPON_SPECIAL_AOE spore_cloud "spore cloud" "When this attack hits, all enemies adjacent to the target take 50% splash damage and are slowed."}
            {WEAPON_SPECIAL_GROVE_BOUND}
        [/specials]
    [/attack]
[/unit_type]
