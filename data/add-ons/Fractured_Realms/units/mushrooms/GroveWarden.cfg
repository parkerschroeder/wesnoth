#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Grove_Warden
    name= _ "Grove Warden"
    race=dwarf
    image="units/dwarves/berserker/berserker.png"
    hitpoints=44
    movement_type=dwarvishfoot
    movement=5
    experience=76
    level=2
    alignment=neutral
    advances_to=Mycelium_Old_Growth
    cost=28
    usage=fighter
    description= _ "Where other Madcaps lose themselves entirely to the mushroom's delirium, the Grove Warden has found something else in the visions — purpose. The fly agaric granted them a fierce clarity and a deep bond with the mycelium's groves. They fight not for madness but for the sacred fungal ground itself, rallying nearby allies with barking commands and leading charges to protect or reclaim grove territory. Their berserk fury is no less savage, but it is wielded with the conviction of a guardian who knows exactly what they are fighting for."
    die_sound=dwarf-die.ogg

    [defense]
        fungus=40
        village=60
    [/defense]

    [abilities]
        {ABILITY_LEADERSHIP}
    [/abilities]

    [attack]
        name=hand_axe
        description= _ "hand axe"
        icon=attacks/axe.png
        type=blade
        range=melee
        damage=6
        number=4
    [/attack]
    [attack]
        name=mushroom_frenzy
        description= _ "mushroom frenzy"
        icon=attacks/axe.png
        type=blade
        range=melee
        damage=6
        number=4
        [specials]
            {WEAPON_SPECIAL_BERSERK}
            {WEAPON_SPECIAL_GROVE_BOUND}
        [/specials]
    [/attack]
    [attack]
        name=spore_toss
        description= _ "spore toss"
        icon=attacks/fungus.png
        type=impact
        range=ranged
        damage=4
        number=3
    [/attack]
[/unit_type]
