#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Ergot
    name= _ "Ergot"
    race=mushroom
    image="units/elves-wood/sorceress.png"
    hitpoints=32
    movement_type=fungalfoot
    movement=5
    experience=100
    level=2
    alignment=chaotic
    advances_to=null
    cost=30
    usage=fighter
    description= _ "Where the Lion's Mane heals, the Ergot corrupts. This parasitic fungus has twisted its restorative knowledge into a weapon — its spores choke the life force of enemies, rendering them unable to heal. When it channels the mycelial network beneath a mushroom grove, it releases a devastating wave of blighting spores that spread the corruption to all nearby foes."
    die_sound=hiss-die.ogg

    [attack]
        name=staff
        description= _ "staff"
        icon=attacks/staff.png
        type=impact
        range=melee
        damage=5
        number=3
    [/attack]
    [attack]
        name=blight_spore
        description= _ "blight spore"
        icon=attacks/mudball.png
        type=impact
        range=ranged
        damage=4
        number=3
        [specials]
            {WEAPON_SPECIAL_BLIGHT}
        [/specials]
    [/attack]
    [attack]
        name=blighting_spores
        description= _ "blighting spores"
        icon=attacks/mudball.png
        type=impact
        range=ranged
        damage=6
        number=3
        [specials]
            {WEAPON_SPECIAL_AOE blight "blighting spores" "When this attack hits, all enemies adjacent to the target take 50% splash damage and become unhealable until their next turn. Unhealable units cannot be healed by healers, villages, or resting."}
            {WEAPON_SPECIAL_GROVE_BOUND}
        [/specials]
    [/attack]
[/unit_type]
