#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Madcap
    name= _ "Madcap"
    race=dwarf
    image="units/dwarves/ulfserker.png"
    hitpoints=34
    movement_type=dwarvishfoot
    movement=5
    experience=40
    level=1
    alignment=chaotic
    advances_to=Mycelium_Mad_Prince,Mycelium_Fungi
    cost=19
    usage=fighter
    description= _ "A crazed dwarf hermit who discovered the mind-altering properties of fly agaric mushrooms deep in the caves. Exiled by their clan for their erratic behavior, they now fight alongside the Mycelium — consuming grove mushrooms before battle to fuel devastating berserk frenzies. Without a grove to feed on, they fight with a simple hand axe, muttering to the fungi only they can hear."
    die_sound=dwarf-die.ogg

    [defense]
        fungus=40
        village=60
    [/defense]

    [attack]
        name=hand_axe
        description= _ "hand axe"
        icon=attacks/axe.png
        type=blade
        range=melee
        damage=4
        number=4
    [/attack]
    [attack]
        name=mushroom_frenzy
        description= _ "mushroom frenzy"
        icon=attacks/axe.png
        type=blade
        range=melee
        damage=4
        number=4
        [specials]
            {WEAPON_SPECIAL_BERSERK}
            {WEAPON_SPECIAL_GROVE_BOUND}
        [/specials]
    [/attack]
[/unit_type]
