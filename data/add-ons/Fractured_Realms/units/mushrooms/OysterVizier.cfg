#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Oyster_Vizier
    name= _ "Oyster Vizier"
    race=mushroom
    image="units/mushrooms/oystervizier.png"
    hitpoints=46
    movement_type=fungalfoot
    movement=4
    experience=82
    level=2
    alignment=chaotic
    advances_to=Mycelium_Oyster_Chamberlain
    cost=32
    usage=fighter
    description= _ "A massive toadstool whose hardened cap can unleash numbing spore puffs that slow their target. By channeling the mycelial network beneath a mushroom grove, it can unleash a devastating spore eruption — a blast that damages and slows all nearby enemies, but the effort consumes the grove entirely."
    die_sound=hiss-die.ogg

    [resistances]
        fire=100
        arcane=100
    [/resistances]

    [defense]
        fungus=40
    [/defense]

    [attack]
        name=club
        description= _ "club"
        icon=attacks/club-small.png
        type=impact
        range=melee
        damage=9
        number=3
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    [/attack]
    [attack]
        name=spore_puff
        description= _ "spore puff"
        icon=attacks/mudball.png
        type=impact
        range=ranged
        damage=6
        number=2
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    [/attack]
    [attack]
        name=spore_eruption
        description= _ "spore eruption"
        icon=attacks/squall.png
        type=impact
        range=ranged
        damage=6
        number=2
        [specials]
            {WEAPON_SPECIAL_SLOW}
            {WEAPON_SPECIAL_AOE spore_cloud "spore cloud" "When this attack hits, all enemies adjacent to the target take 50% splash damage and are slowed."}
            {WEAPON_SPECIAL_GROVE_BOUND}
        [/specials]
    [/attack]

    {MUSHROOM_DEFEND "units/mushrooms/oystervizier.png" hiss-hit.wav}
    {MUSHROOM_DEATH_SINK "units/mushrooms/oystervizier.png" hiss-die.ogg}
    {MUSHROOM_ATTACK_MELEE "units/mushrooms/oystervizier.png" club club.ogg}
    {MUSHROOM_ATTACK_RANGED_MAGIC "units/mushrooms/oystervizier.png" spore_puff staff.ogg}
    {MUSHROOM_ATTACK_RANGED_MAGIC "units/mushrooms/oystervizier.png" spore_eruption staff.ogg}
[/unit_type]
