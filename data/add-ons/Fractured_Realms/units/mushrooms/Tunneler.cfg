#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Tunneler
    name= _ "Mycelium Tunneler"
    race=mushroom
    image="units/saurians/ambusher/ambusher.png"
    hitpoints=38
    movement_type=fungalfoot
    movement=8
    experience=55
    level=2
    alignment=chaotic
    advances_to=Mycelium_Threadmaster
    cost=30
    usage=scout
    description= _ "The Tunneler has learned to dissolve into the underground mycelial network and reform at a distant grove in an instant. Where the Weaver spreads the network outward, the Tunneler exploits the network that already exists — vanishing from one patch of mushrooms and emerging from another across the battlefield. This makes it a devastating flanker and raider, impossible to pin down as long as fungal terrain connects its escape routes."
    die_sound=hiss-die.ogg

    [abilities]
        [dummy]
            id=disengage
            name= _ "disengage"
            description= _ "After attacking, this unit retains 1 movement point, allowing it to retreat or reposition."
        [/dummy]
        [teleport]
            id=fungal_tunnel
            name= _ "fungal tunnel"
            description= _ "This unit can teleport between any mushroom grove or mushroom forest tiles."
            affect_self=yes
            [tunnel]
                id=fungal_tunnel
                [source]
                    terrain=*^Tf,*^Tff
                [/source]
                [target]
                    terrain=*^Tf,*^Tff
                [/target]
                [filter]
                [/filter]
            [/tunnel]
        [/teleport]
    [/abilities]

    [attack]
        name=tendril_lash
        description= _ "tendril lash"
        icon=attacks/tentacle.png
        type=blade
        range=melee
        damage=7
        number=3
    [/attack]
    [attack]
        name=entangle
        description= _ "entangle"
        icon=attacks/entangle.png
        type=impact
        range=melee
        damage=5
        number=2
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    [/attack]
[/unit_type]
