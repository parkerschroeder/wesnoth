#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Deadly_Dapperling
    name= _ "Deadly Dapperling"
    race=mushroom
    image="units/mushrooms/deadlydapperling.png"
    hitpoints=46
    movement_type=fungalfoot
    movement=5
    experience=150
    level=3
    alignment=chaotic
    advances_to=null
    {AMLA_DEFAULT}
    cost=48
    usage=archer
    description= _ "Named for Lepiota brunneoincarnata — one of the most lethal fungi on earth — the Deadly Dapperling has perfected poisonous warfare. Its toxin cloud strikes with uncanny precision, guided by the mycelial network to find gaps in any defense. When its grove claims a kill, the victim's body erupts into not one but two Spores, seeding the battlefield faster than any foe can clear it."
    die_sound=hiss-die.ogg

    [attack]
        name=toxic_touch
        description= _ "toxic touch"
        icon=attacks/touch-undead.png
        type=blade
        range=melee
        damage=8
        number=3
        [specials]
            {WEAPON_SPECIAL_POISON}
        [/specials]
    [/attack]
    [attack]
        name=poison_dart
        description= _ "poison dart"
        icon=attacks/sling.png
        type=pierce
        range=ranged
        damage=9
        number=2
        [specials]
            {WEAPON_SPECIAL_POISON}
        [/specials]
    [/attack]
    [attack]
        name=poison_cloud
        description= _ "poison cloud"
        icon=attacks/mudball.png
        type=impact
        range=ranged
        damage=7
        number=3
        [specials]
            {WEAPON_SPECIAL_POISON}
            {WEAPON_SPECIAL_MARKSMAN}
            {WEAPON_SPECIAL_AOE poison_cloud "poison cloud" "When this attack hits, all enemies adjacent to the target take 50% splash damage and are poisoned."}
            {WEAPON_SPECIAL_GROVE_BOUND}
        [/specials]
    [/attack]
[/unit_type]
