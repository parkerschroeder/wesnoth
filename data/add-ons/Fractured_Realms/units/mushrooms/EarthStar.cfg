#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Earth_Star
    name= _ "Earth Star"
    race=mushroom
    image="units/mushrooms/earthstar.png"
    hitpoints=40
    movement_type=fungalfoot
    movement=5
    experience=75
    level=2
    alignment=neutral
    advances_to=Mycelium_Milky_Way
    cost=34
    usage=archer
    description= _ "Named for the real Geastrum, whose outer skin peels back into dramatic star-shaped rays, the Earth Star channels bioelectric energy through its splayed, pointed appendages like a living lightning rod. When it discharges, arcing bolts leap from ray to ray and into enemies near the target in a crackling star-burst. Its focused spark bolt strikes with equal precision. Fragile but devastating — nature's own tesla coil, shaped like a fallen star."
    die_sound=hiss-die.ogg

    [attack]
        name=shock_touch
        description= _ "shock touch"
        icon=attacks/lightning.png
        type=electric
        range=melee
        damage=5
        number=2
    [/attack]
    [attack]
        name=spark_bolt
        description= _ "spark bolt"
        icon=attacks/lightning.png
        type=electric
        range=ranged
        damage=10
        number=3
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
    [/attack]
    [attack]
        name=lightning_storm
        description= _ "lightning storm"
        icon=attacks/squall.png
        type=electric
        range=ranged
        damage=10
        number=3
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
            {WEAPON_SPECIAL_AOE lightning_storm "lightning storm" "When this attack hits, all enemies adjacent to the target take 70% splash electric damage."}
            {WEAPON_SPECIAL_GROVE_BOUND}
        [/specials]
    [/attack]

    {MUSHROOM_DEFEND_BLINK "units/mushrooms/earthstar.png" hiss-hit.wav}
    {MUSHROOM_DEATH "units/mushrooms/earthstar.png" hiss-die.ogg}
    {MUSHROOM_ATTACK_MELEE "units/mushrooms/earthstar.png" shock_touch lightning.ogg}
    {MUSHROOM_ATTACK_RANGED_MAGIC "units/mushrooms/earthstar.png" spark_bolt lightning.ogg}
    {MUSHROOM_ATTACK_RANGED_MAGIC "units/mushrooms/earthstar.png" lightning_storm lightning.ogg}
[/unit_type]
