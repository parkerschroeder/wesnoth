#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Earth_Star
    name= _ "Earth Star"
    race=mushroom
    image="units/undead-necromancers/dark-sorcerer.png"
    hitpoints=40
    movement_type=fungalfoot
    movement=5
    experience=75
    level=2
    alignment=neutral
    advances_to=null
    cost=34
    usage=archer
    description= _ "The Shaggy Mane has grown its bioluminescent network into a crackling storm of bioelectric fury. Its lightning storm attack discharges arcing bolts that leap to enemies near the target, while its focused spark bolt strikes with precision. Fragile but devastating — a living tesla coil rooted in fungal flesh."
    die_sound=hiss-die.ogg

    [attack]
        name=spark_bolt
        description= _ "spark bolt"
        icon=attacks/lightning.png
        type=electric
        range=ranged
        damage=10
        number=3
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
    [/attack]
    [attack]
        name=lightning_storm
        description= _ "lightning storm"
        icon=attacks/lightning.png
        type=electric
        range=ranged
        damage=10
        number=3
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
            {WEAPON_SPECIAL_AOE lightning_storm "lightning storm" "When this attack hits, all enemies adjacent to the target take 70% splash electric damage."}
            {WEAPON_SPECIAL_GROVE_BOUND}
        [/specials]
    [/attack]
    [attack]
        name=shock_touch
        description= _ "shock touch"
        icon=attacks/lightning.png
        type=electric
        range=melee
        damage=5
        number=2
    [/attack]
[/unit_type]
