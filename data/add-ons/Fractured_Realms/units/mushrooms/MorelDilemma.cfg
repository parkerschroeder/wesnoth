#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Morel_Dilemma
    name= _ "Morel Dilemma"
    race=mushroom
    image="units/mushrooms/moreldilemma.png"
    hitpoints=45
    movement_type=fungalfoot
    movement=5
    experience=75
    level=2
    alignment=chaotic
    advances_to=Mycelium_False_Morel
    cost=34
    usage=fighter
    description= _ "The Morel Dilemma is a bloated, pulsing fungal horror that infects the battlefield with its spores. Its mere presence causes nearby allies' attacks to spawn Spores from slain enemies, turning every kill into reinforcements."
    die_sound=hiss-die.ogg

    [abilities]
        [plague]
            id=fungal_brood
            name= _ "fungal brood"
            description= _ "Adjacent allied units' attacks spawn Spores from slain enemies."
            type=Mycelium_Spore
            affect_self=no
            affect_allies=yes
            [affect_adjacent]
            [/affect_adjacent]
        [/plague]
    [/abilities]

    [attack]
        name=parasitic_touch
        description= _ "parasitic touch"
        icon=attacks/touch-undead.png
        type=blade
        range=melee
        damage=8
        number=3
        [specials]
            {WEAPON_SPECIAL_FUNGAL_PLAGUE}
        [/specials]
    [/attack]

    {MUSHROOM_DEFEND "units/mushrooms/moreldilemma.png" hiss-hit.wav}
    {MUSHROOM_DEATH "units/mushrooms/moreldilemma.png" hiss-die.ogg}
    {MUSHROOM_ATTACK_MELEE "units/mushrooms/moreldilemma.png" parasitic_touch hiss.wav}
[/unit_type]
