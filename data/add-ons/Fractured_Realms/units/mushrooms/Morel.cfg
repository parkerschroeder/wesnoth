#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Morel
    name= _ "Morel"
    race=mushroom
    image="units/monsters/cuttlefish.png"
    hitpoints=38
    movement_type=fungalfoot
    movement=5
    experience=100
    level=2
    alignment=neutral
    advances_to=null
    cost=30
    usage=healer
    description= _ "The Morel is a deeply networked fungus whose restorative presence heals nearby allies. When it channels the mycelial network beneath a mushroom grove, it releases a wave of blighting spores that choke the life force of nearby enemies, rendering them unable to heal. The effort consumes the grove entirely."
    die_sound=hiss-die.ogg

    [abilities]
        {ABILITY_HEALS}
    [/abilities]

    [attack]
        name=staff
        description= _ "staff"
        icon=attacks/staff.png
        type=impact
        range=melee
        damage=5
        number=3
    [/attack]
    [attack]
        name=restorative_spores
        description= _ "restorative spores"
        icon=attacks/mudball.png
        type=impact
        range=ranged
        damage=5
        number=3
    [/attack]
    [attack]
        name=blighting_spores
        description= _ "blighting spores"
        icon=attacks/mudball.png
        type=impact
        range=ranged
        damage=6
        number=3
        [specials]
            {WEAPON_SPECIAL_AOE_UNHEALABLE}
            {WEAPON_SPECIAL_GROVE_BOUND}
        [/specials]
    [/attack]
[/unit_type]
