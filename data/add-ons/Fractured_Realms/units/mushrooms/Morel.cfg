#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Morel
    name= _ "Morel"
    race=mushroom
    image="units/mushrooms/morel.png"
    hitpoints=30
    movement_type=fungalfoot
    movement=5
    experience=36
    level=1
    alignment=chaotic
    advances_to=Mycelium_Morel_Dilemma,Mycelium_Morel_Support
    cost=16
    usage=fighter
    description= _ "Like its real-world namesake, the Morel is a deceptively humble fungus that thrives by leeching nutrients from the roots of others. Its pitted, honeycomb cap hides a voracious appetite — in melee, it latches onto victims and drains their life force to sustain itself. Cheap and self-sustaining, the Morel is the Mycelium's expendable frontline parasite."
    die_sound=hiss-die.ogg

    [attack]
        name=parasitic_touch
        description= _ "parasitic touch"
        icon=attacks/touch-undead.png
        type=blade
        range=melee
        damage=5
        number=3
        [specials]
            {WEAPON_SPECIAL_DRAIN}
        [/specials]
    [/attack]
[/unit_type]
