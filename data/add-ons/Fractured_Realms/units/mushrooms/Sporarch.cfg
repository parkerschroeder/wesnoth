#textdomain wesnoth-Fractured_Realms

[unit_type]
    id=Mycelium_Sporarch
    name= _ "Sporarch"
    race=mushroom
    image="units/dunefolk/rover/wayfarer.png"
    hitpoints=55
    movement_type=fungalfoot
    movement=7
    experience=150
    level=3
    alignment=chaotic
    advances_to=null
    {AMLA_DEFAULT}
    cost=52
    usage=mixed fighter
    description= _ "The Sporarch is the pinnacle of the Broodcap line — a swift, towering fungal horror whose mycelial network stretches far beneath the battlefield. Where lesser Broodcaps must stand close to spread their infection, the Sporarch moves with unnatural speed, rushing to wherever the fighting is thickest to infuse nearby allies with its spore-laden presence. Enemies slain near the Sporarch don't merely sprout — they erupt into fully formed Puffballs, volatile suicide bombers that carry the cycle of death and rebirth ever forward."
    die_sound=hiss-die.ogg

    [abilities]
        [plague]
            id=enhanced_fungal_brood
            name= _ "enhanced fungal brood"
            description= _ "Adjacent allied units' attacks spawn Puffballs from slain enemies."
            type=Mycelium_Puffball
            affect_self=no
            affect_allies=yes
            [affect_adjacent]
            [/affect_adjacent]
        [/plague]
    [/abilities]

    [attack]
        name=parasitic_touch
        description= _ "parasitic touch"
        icon=attacks/touch-undead.png
        type=blade
        range=melee
        damage=7
        number=3
        [specials]
            {WEAPON_SPECIAL_DRAIN}
        [/specials]
    [/attack]
    [attack]
        name=domination_spore
        description= _ "domination spore"
        icon=attacks/mudball.png
        type=arcane
        range=ranged
        damage=7
        number=4
        [specials]
            {WEAPON_SPECIAL_FUNGAL_PLAGUE}
        [/specials]
    [/attack]
[/unit_type]
