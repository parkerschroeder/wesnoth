#textdomain wesnoth-Fractured_Realms

# Spawned by Grove Reanimation event — not recruitable
[unit_type]
    id=Mycelium_Fungal_Spore
    name= _ "Fungal Spore"
    race=mushroom
    image="units/elves-deep/wisp.png"
    hitpoints=18
    movement_type=fungalfoot
    flies=yes
    movement=5
    experience=30
    level=0
    alignment=chaotic
    [movement_costs]
        shallow_water=1
        reef=1
        swamp_water=1
        sand=1
        hills=1
        mountains=1
        frozen=1
    [/movement_costs]
    [defense]
        shallow_water=50
        reef=50
        swamp_water=50
        flat=50
        sand=50
        forest=50
        hills=50
        mountains=50
        village=50
        castle=50
        cave=50
        frozen=50
        fungus=40
    [/defense]
    advances_to=Mycelium_Puffball
    cost=6
    usage=fighter
    description= _ "A drifting cloud of fungal spores released from the grove's mycelium. It floats effortlessly over any terrain, spreading plague and seeding new groves when destroyed."
    die_sound=hiss-die.ogg

    [abilities]
        [dummy]
            id=death_bloom
            name= _ "death bloom"
            female_name= _ "female^death bloom"
            description= _ "When this unit dies, nearby hexes are converted to Mushroom Grove and adjacent enemies are poisoned."
        [/dummy]
    [/abilities]

    [attack]
        name=fungal_fist
        description= _ "fungal fist"
        icon=attacks/fist.png
        type=impact
        range=melee
        damage=4
        number=2
        [specials]
            {WEAPON_SPECIAL_FUNGAL_PLAGUE}
        [/specials]
    [/attack]
[/unit_type]
